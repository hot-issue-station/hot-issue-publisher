<meta name="description" content="덕심저장소 아이돌 갤러리 — 건물 밖에서 로비, 관, 방까지 걸어 다니며 둘러보는 3D 미술관(시험판)">
<script>
/* =====================================================================
   설정 — 이 블록만 고치면 된다.
   구조: 입장(언어·캐릭터) → 건물 밖 → 로비(관 문) → 관 홀(방 문) → 방(액자 전시)
   ===================================================================== */

/* 건물 외관: "classic"(고대 신전풍) | "museum"(낮고 긴 박물관풍). 주소 끝 ?style=museum 으로도 바꿔 볼 수 있다 */
const BUILDING_STYLE = "classic";

/* 관 목록. 관을 추가하면 로비에 문이, 방을 추가하면 관 홀에 문이 자동으로 생긴다.
   관: {id, name:{ko,ja,en,zh}, color, open, official?, curation?, rooms:[...]}
     - open:false    → 잠긴 문(흐리게, 「준비 중」)
     - curation:true → gallery/curation.json 이 있으면 themes[].id 와 같은 id의 방 액자를 그 목록으로 채운다
   방: {id, name:{ko,ja,en,zh}, decor, color, videos:[], photos?:[], goods?:[], theme?, desc?, story?}
     - desc: 방 한 줄 설명(문자열 또는 {ko,ja,en,zh}). story: 방 이야기 카드 문구(우리가 쓴 글, 2~4줄) — 방 입구 벽 큰 안내판에 표시.
             story가 비어 있으면 안내판에 방 이름과 한 줄 설명만. curation.json themes[].story·desc 로도 넣을 수 있다
     - decor: stage(무대) | cozy(안원잘부) | studio(TV 예능) | youtube(유튜브 출연) | daily(일상) | birthday(생일카페) | plain
     - videos: {id, title, desc, note?, kind:"short"|"long", added_at:"YYYY-MM-DD", official?, channel?, picks?:[{name,price,url}]}
               note = 우리가 쓴 소개 2~3줄(영상 패널 제목 아래에 표시, 비어 있으면 숨김). curation.json 영상 항목의 note도 읽는다.
               picks는 영상 패널에 보이지 않고 그 방 「추천 상점」 진열대에서만 보인다(유튜브 API 정책 III.G: 플레이어 위·안·바로 아래 광고 금지)

     - photos(생일카페 벽 폴라로이드): 사진 파일을 복사하지 않는다.
               {type:"youtube", id, title, kind, official:true}   → 유튜브가 주는 썸네일, 누르면 임베드
               {type:"instagram", url:"", date:"", caption:""}    → 분홍·보라 카드, 누르면 인스타그램 공식 임베드
               url 칸 = 대표가 고른 게시물 주소를 넣는 칸 (예: https://www.instagram.com/p/XXXXXXXXXXX/)
     - theme(생일카페): {member, memberEn, color, accent, title, date}

        videos:[],
        photos:[
          {type:"youtube", id:"9XttLI0oH0I", kind:"long", official:true, title:"‘LOVE ATTACK’ Official MV"},
          {type:"instagram", url:"", date:"", caption:""},   // ← 대표가 고른 게시물 주소를 넣는 칸
          {type:"instagram", url:"", date:"", caption:""},   // ←
          {type:"instagram", url:"", date:"", caption:""},   // ←
          {type:"instagram", url:"", date:"", caption:""},   // ←

    ]},
  /* 비밀의 방: 관을 클리어하면 나타난다(hidden). 액자는 MISSIONS 보상 영상 + 여기 videos. 공식 채널에 공개된 영상의 임베드만, 비공개·유출 영상 금지 */
  { id:"hall2", name:{ko:"2관", ja:"第2館", en:"Hall 2", zh:"第2館"}, color:"#f3bfa0", open:false, rooms:[] },

/* 미션 — 곳곳에 숨은 미션을 풀면 '비밀 액자'가 열리며 보상 영상을 보여 준다.

   ★ 퀴즈 소재는 공식적으로 공개된 정보만: 공식 프로필(생일·포지션·애칭·공식 상징색), 멤버가 방송·공식 콘텐츠에서 직접 말한 것(출처 영상 표시).

    source:"",       // ← 공식 출처 링크(소속사 공식 프로필 등)를 직접 열어 확인한 뒤 넣는다. 비어 있으면 이 문제는 숨김
    checked_at:"",   // ← 확인한 날짜(예: 2026-11-11)
    reward:{ video_id:"", title:"" } },
];

/* 추천·열람 집계 어댑터. 지금은 "local"(이 기기 안에서만 셈 — 시험용).
   TODO: 대표 계정 Firebase(무료 등급)를 만들면 FIREBASE_CONFIG에 {apiKey, authDomain, projectId, appId}를 넣고
         STATS_FIREBASE.record/get 을 Firestore 증가(increment) 코드로 채운다. null이면 꺼져 있다. */
const FIREBASE_CONFIG = null;

   관의 방을 모두 클리어하면 비밀의 방이 열리고, 로비의 nextHall 문에 「클리어 보상: 먼저 열림」 표시.
   시청 완료 = 유튜브 IFrame Player API로 watchSeconds초 이상 재생 또는 끝까지(쇼츠는 끝까지). API를 못 쓰면 패널을 fallbackSeconds초 열어 두면 인정.
   enabled:false → 전체 잠금 해제(운영용). 방마다 need를 바꾸려면 need:{방id: 편수} */
const PROGRESS = { enabled:true, hall:"rescene", order:["stage","anwonjalbu","tv","youtube_guest","daily","birthday"],
  openAtStart:2, need:{ default:3 }, watchSeconds:30, fallbackSeconds:20, nextHall:"hall2", secretRoom:"secret" };

   place: screen_top(화면 맨 위 띠 — 영상 패널이 열려 있는 동안은 숨김) | street_billboard(건물 밖 전광판) | lobby_billboard(로비 전광판)
          | sky_blimp(건물 밖 하늘 비행선 옆면 가로 띠, 512×96) | sky_holo_1·2·3(입구 위 공중 홀로그램 판, 512×256)
          ※ 영상 패널(유튜브 임베드) 안·바로 아래에는 광고 칸을 두지 않는다(YouTube API 개발자 정책 III.G). panel_bottom은 없앴다
          | lobby_top · hall_top · room_top (벽 위쪽 지하철식 광고판 줄 — 칸 번호 _1, _2 …. 적지 않은 칸은 「광고 자리」 판이 보인다)
   전광판(street/lobby_billboard)에 이미지가 들어오면 순환 슬라이드 사이에 끼어든다. */

  {slot_id:"street_billboard_1", place:"street_billboard", size:"512 × 256",         image:null, link:null, label:"광고"},
  {slot_id:"lobby_billboard_1",  place:"lobby_billboard",  size:"512 × 256",         image:null, link:null, label:"광고"},
  {slot_id:"room_top_1",         place:"room_top",         size:"512 × 80",          image:null, link:null, label:"광고"},
  {slot_id:"sky_blimp_1",        place:"sky_blimp",        size:"512 × 96",          image:null, link:null, label:"광고"},

  {slot_id:"sky_holo_3",         place:"sky_holo_3",       size:"512 × 256",         image:null, link:null, label:"광고"},

/* 광고 문의: form_url = 대표가 만든 구글 설문지 주소(문의가 우리 메일로 발송됨). 메일 주소·전화번호는 화면·코드 어디에도 넣지 않는다. */

/* 로비 「한국 문화 코너」 — 지금은 빈 진열대. 나중에 한복·한글·한국 음식 등을 {title:{ko,ja,en,zh}, desc?, video_id?} 로 넣는다 */

   상품의 상점에 맞는 대가성 문구가 자동으로 붙는다. note는 각 제휴 프로그램이 정한 공식 문구로(승인 후 확인해서 바꿀 것). */

:root{
  --bg:#f6efe3; --paper:#fffaf2; --ink:#1e143c; --sub:#6b6280; --line:#e4d8c4;
  --y:#ffd640; --p:#9650e6; --r:#ff465a; --theme:#9db8e8; --shadow:0 8px 30px rgba(40,25,10,.18);
  --font:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic","Hiragino Sans","PingFang TC","Noto Sans CJK KR",system-ui,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
body{overflow:hidden}
body.flat{overflow:auto}
button,select{font:inherit;color:inherit;cursor:pointer}
#stage{position:fixed;inset:0;touch-action:none;outline:none}
#stage canvas{display:block;width:100%;height:100%}

.adtop{position:fixed;left:0;right:0;top:0;z-index:9;height:calc(22px + env(safe-area-inset-top));padding-top:env(safe-area-inset-top);display:flex;align-items:center;justify-content:center;gap:6px;
  background:#efe7da;color:var(--sub);font-size:11px;text-decoration:none;border-bottom:1px solid var(--line);background-size:cover;background-position:center}
.adtop b,.adslot b{background:var(--ink);color:#fff;border-radius:4px;padding:1px 5px;font-size:10px}
.adslot{display:flex;align-items:center;justify-content:center;gap:6px;height:64px;margin-top:14px;border:1px dashed var(--line);border-radius:12px;color:var(--sub);font-size:12px;text-decoration:none;background:#faf6ef center/cover no-repeat}
.top{position:fixed;left:0;right:0;top:calc(22px + env(safe-area-inset-top));z-index:5;padding:10px 16px 10px;
  background:linear-gradient(var(--bg) 60%,rgba(246,239,227,0));pointer-events:none}
.top>*{pointer-events:auto}
body[data-view=outside]:not(.flat) .top{background:linear-gradient(rgba(255,255,255,.75) 55%,rgba(255,255,255,0))}
.bar{display:flex;align-items:center;gap:10px}
.brand{flex:1;min-width:0}
.brand h1{margin:0;font-size:18px;line-height:1.25;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.brand small{display:block;font-size:11px;color:var(--sub);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.langSel{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:7px 10px;font-size:13px;min-height:36px}
.crumbs{display:flex;gap:8px;margin-top:10px;overflow-x:auto;scrollbar-width:none}
.crumbs:empty{display:none}
.prog{display:none;align-items:center;gap:8px;margin-top:8px;font-size:12px;color:var(--sub)}
body[data-view=hub] .prog.on,body[data-view=room] .prog.on{display:flex}
.prog i{flex:1;height:8px;border-radius:8px;background:#e9e0d1;overflow:hidden;max-width:180px}
.prog i b{display:block;height:100%;background:linear-gradient(90deg,var(--y),var(--r));border-radius:8px;transition:width .6s}
.crumbs .lockr{color:var(--sub)}
.crumbs button{flex:none;border:1px solid var(--line);background:var(--paper);border-radius:999px;padding:8px 14px;font-size:14px;min-height:38px}
.crumbs .back{background:var(--ink);color:#fff;border-color:var(--ink);font-weight:700}
.crumbs .on{background:var(--theme);border-color:var(--theme);font-weight:700}
.crumbs .lock{color:var(--sub);border-style:dashed}
.side{position:fixed;right:16px;top:calc(146px + env(safe-area-inset-top));z-index:5;display:flex;flex-direction:column;gap:8px}
.side button{border:1px solid var(--line);background:rgba(255,250,242,.94);border-radius:14px;padding:7px 10px;font-size:12px;min-height:38px;box-shadow:0 2px 8px rgba(40,25,10,.1)}
body.flat .side .mode{display:none}
body.flat .side{top:auto;bottom:calc(60px + env(safe-area-inset-bottom))}

.enterBtn{position:fixed;left:50%;bottom:calc(70px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:6;border:0;
  background:var(--ink);color:#fff;font-weight:700;font-size:17px;padding:14px 34px;border-radius:999px;box-shadow:var(--shadow);display:none}
body[data-view=outside]:not(.flat) .enterBtn{display:block}
body.walk[data-view=outside]:not(.flat) .enterBtn{left:auto;right:16px;transform:none;font-size:15px;padding:12px 22px}
.hint{position:fixed;left:50%;bottom:calc(64px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:4;
  background:rgba(30,20,60,.82);color:#fff;font-size:13px;padding:9px 14px;border-radius:999px;width:max-content;max-width:calc(100% - 140px);
  text-align:center;transition:opacity .6s;pointer-events:none}
.hint.off{opacity:0}
body[data-view=outside] .hint{bottom:calc(136px + env(safe-area-inset-bottom));max-width:calc(100% - 32px)}
body.walk .hint{bottom:auto;top:calc(150px + env(safe-area-inset-top));left:16px;transform:none;max-width:calc(100% - 132px)}
.turn{position:fixed;bottom:calc(58px + env(safe-area-inset-bottom));z-index:4;width:46px;height:46px;border-radius:50%;
  border:1px solid var(--line);background:rgba(255,250,242,.92);font-size:20px;box-shadow:var(--shadow);display:flex;align-items:center;justify-content:center}
.turn.l{left:16px}.turn.r{right:16px}
body[data-view=outside] .turn, body.walk .turn{display:none}
/* 걷기 모드: 왼쪽 아래 조이스틱 + 다가가면 뜨는 말풍선 버튼 */
.joy{position:fixed;left:16px;bottom:calc(56px + env(safe-area-inset-bottom));z-index:6;width:116px;height:116px;border-radius:50%;
  background:rgba(255,250,242,.55);border:2px solid rgba(30,20,60,.18);touch-action:none;display:none}
body.walk:not(.flat) .joy{display:block}
.joy i{position:absolute;left:50%;top:50%;width:50px;height:50px;margin:-25px 0 0 -25px;border-radius:50%;background:var(--ink);opacity:.85;box-shadow:var(--shadow)}
.bubble{position:fixed;z-index:7;left:0;top:0;transform:translate(-50%,-100%);border:0;background:#fffdf8;color:var(--ink);
  border-radius:16px;padding:9px 14px;font-size:14px;font-weight:700;box-shadow:var(--shadow);display:none;max-width:70vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bubble:after{content:"";position:absolute;left:50%;bottom:-7px;margin-left:-7px;border:7px solid transparent;border-bottom:0;border-top-color:#fffdf8}
.bubble.on{display:block}
.bubble small{font-weight:500;color:var(--sub);margin-left:6px}
.note{position:fixed;left:0;right:0;bottom:0;z-index:4;padding:8px 16px calc(8px + env(safe-area-inset-bottom));margin:0;
  font-size:11px;line-height:1.45;color:var(--sub);text-align:center;background:linear-gradient(rgba(246,239,227,0),var(--bg) 40%)}
.toast{position:fixed;left:50%;top:42%;transform:translate(-50%,-50%) scale(.96);z-index:30;background:var(--ink);color:#fff;
  padding:12px 18px;border-radius:14px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:calc(100% - 32px);text-align:center;line-height:1.5}
.toast.on{opacity:1;transform:translate(-50%,-50%) scale(1)}
.suggest{position:fixed;left:16px;right:16px;top:calc(146px + env(safe-area-inset-top));z-index:8;background:var(--ink);color:#fff;border-radius:14px;padding:10px 12px;font-size:13px;display:none;align-items:center;gap:8px}
.suggest.on{display:flex}.suggest span{flex:1}
.suggest button{border:0;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700;background:var(--y);color:var(--ink)}
.suggest button.x{background:transparent;color:#fff}
.fade{position:fixed;inset:0;z-index:15;background:#fffaf2;opacity:0;pointer-events:none;transition:opacity .35s}
.fade.on{opacity:1}

.loading{position:fixed;inset:0;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;background:var(--bg);color:var(--sub);font-size:14px;transition:opacity .5s}
.loading.off{opacity:0;pointer-events:none}
.dots{display:flex;gap:6px}.dots i{width:9px;height:9px;border-radius:50%;background:var(--p);animation:b 1s infinite alternate}
.dots i:nth-child(2){animation-delay:.2s;background:var(--y)}.dots i:nth-child(3){animation-delay:.4s;background:var(--r)}
@keyframes b{to{transform:translateY(-8px);opacity:.5}}

/* 입장 화면: 언어 → 캐릭터 → 둘러보는 방법 */
.intro{position:fixed;inset:0;z-index:40;background:linear-gradient(#bfe0f5,#fff3e0 70%);display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}
.intro[hidden]{display:none}
.introBox{width:100%;max-width:420px;background:rgba(255,253,248,.95);border-radius:22px;box-shadow:var(--shadow);padding:22px 18px}
.introBox h2{margin:0 0 4px;font-size:20px;text-align:center}
.introBox p{margin:0 0 16px;color:var(--sub);font-size:13px;text-align:center}
.langs{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.langs button,.modes button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px 10px;font-size:16px;font-weight:700;min-height:52px}
.langs button.on,.chars button.on,.modes button.on{border-color:var(--ink);box-shadow:0 0 0 2px var(--ink) inset}
.petTabs{display:flex;gap:6px;margin-bottom:8px;overflow-x:auto;scrollbar-width:none}
.petTabs button{flex:none;border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 11px;font-size:13px;font-weight:700;min-height:36px}
.petIntro{margin:8px 2px 0;font-size:12px;color:var(--sub);line-height:1.5;min-height:18px}
.contactBtn{display:block;width:100%;margin-top:14px;border:0;background:var(--ink);color:#fff;font-weight:700;font-size:15px;padding:13px;border-radius:999px}
.contactNote{margin:8px 0 0;font-size:11px;color:var(--sub);text-align:center}
.badges{display:flex;gap:6px;margin-top:8px}.badges b{background:var(--ink);color:#fff;border-radius:4px;padding:2px 6px;font-size:11px}.badges b.sel{background:var(--r)}
a.contactBtn{text-align:center;text-decoration:none}a.contactBtn[aria-disabled=true]{opacity:.45;pointer-events:none}
.prodImg{width:100%;max-height:46vh;object-fit:contain;background:#fff;border-radius:12px}
.idols{display:grid;gap:8px;margin-top:12px}.idols button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:14px;font-size:16px;font-weight:700;text-align:left}
.idols button[disabled]{opacity:.5}
.petTabs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.chars{display:grid;grid-template-columns:repeat(auto-fit,minmax(60px,1fr));gap:6px}
.chars button{border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 2px 6px;font-size:11px;line-height:1.25;display:flex;flex-direction:column;align-items:center;gap:4px;min-height:92px;word-break:keep-all}
.chars canvas{width:48px;height:48px}
.modes{display:grid;gap:8px}
.modes button{text-align:left;font-size:15px}.modes small{display:block;font-weight:400;color:var(--sub);font-size:12px;margin-top:3px}
.sub{margin:18px 0 8px;font-size:13px;color:var(--sub);font-weight:700}
.go{display:block;width:100%;margin-top:18px;border:0;background:var(--ink);color:#fff;font-weight:700;font-size:16px;padding:14px;border-radius:999px}

/* 아래에서 올라오는 패널 */
.shade{position:fixed;inset:0;z-index:20;background:rgba(30,20,60,.35);opacity:0;pointer-events:none;transition:opacity .3s}
.shade.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;max-width:560px;margin:0 auto;max-height:90vh;max-height:90dvh;overflow-y:auto;
  background:var(--paper);border-radius:22px 22px 0 0;box-shadow:var(--shadow);padding:10px 16px calc(18px + env(safe-area-inset-bottom));
  transform:translateY(105%);transition:transform .35s cubic-bezier(.2,.8,.2,1);overscroll-behavior:contain}
.sheet.on{transform:none}
.grab{width:44px;height:5px;border-radius:5px;background:var(--line);margin:0 auto 8px}
.sheet .close{position:absolute;right:12px;top:10px;border:0;background:var(--bg);border-radius:999px;padding:6px 12px;font-size:13px;min-height:34px}
.player{margin:28px auto 0;border-radius:14px;overflow:hidden;position:relative}
.player:empty{display:none}
.player.long{width:100%;aspect-ratio:16/9;background:#000}
.player.short{aspect-ratio:9/16;height:min(56vh,calc((100vw - 32px)*16/9));height:min(56dvh,calc((100vw - 32px)*16/9));max-width:100%;background:#000}
.player iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.player.insta{overflow:visible}
.player.insta .instagram-media{margin:0 auto!important;max-width:540px;min-width:280px!important;width:100%!important;background:#fff;border:1px solid var(--line)!important;border-radius:12px!important;padding:0}
.igwait{display:block;padding:28px 18px;text-align:center;font-size:13px;line-height:1.6;color:var(--sub);text-decoration:none;background:linear-gradient(135deg,#ffd1e6,#e2d0ff);border-radius:12px}
.player.text{margin-top:30px}
.sheet h2{font-size:18px;margin:14px 0 4px;line-height:1.35}
.sheet .tag{display:inline-block;background:var(--r);color:#fff;border-radius:8px;padding:2px 8px;font-size:11px;font-weight:700;vertical-align:middle;margin-left:6px}
.sheet .desc{margin:0;color:var(--sub);font-size:14px;line-height:1.6;white-space:pre-line}
.sheet .desc:empty{display:none}
.vnote{margin:6px 0 8px;padding:10px 12px;background:var(--paper);border-left:3px solid var(--theme);border-radius:8px;font-size:14px;line-height:1.65;color:var(--ink);white-space:pre-line}
.vnote:empty{display:none}
body.playing .adtop{display:none}   /* 유튜브 정책: 영상 패널이 열려 있는 동안 맨 위 광고 띠 숨김 */
.react{display:flex;align-items:center;gap:8px;margin-top:10px}
.react[hidden]{display:none}
.react button{border:1px solid var(--line);background:#fff;border-radius:999px;padding:7px 14px;font-size:13px;font-weight:700;min-height:36px}
.react button[disabled]{background:var(--y);border-color:var(--y);cursor:default}
.react span{font-size:12px;color:var(--sub)}
.src{display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin-top:10px;font-size:12px;color:var(--sub)}
.src[hidden]{display:none}
.src a{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;border-radius:999px;padding:7px 12px;font-size:12px;font-weight:700}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.choices button{border:1px solid var(--line);background:#fff;border-radius:12px;padding:12px;font-size:16px;font-weight:700}
.list{margin:12px 0 0;padding:0;list-style:none}
.list li{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;border-bottom:1px solid var(--line);padding:10px 2px;font-size:14px}
.list li small{color:var(--sub)}
.picks{margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
.picks[hidden]{display:none}
.picks h3{margin:0 0 8px;font-size:13px;color:var(--p)}
.picks h3::after{content:"광고 · AD";margin-left:6px;background:var(--ink);color:#fff;border-radius:4px;padding:1px 5px;font-size:10px;vertical-align:1px}
.pick small{display:block;color:var(--sub);font-size:11px;margin-top:2px}
.picks .row{display:flex;gap:8px;overflow-x:auto}
.pick{flex:none;width:136px;background:var(--bg);border-radius:12px;padding:10px;color:var(--ink);text-decoration:none;font-size:13px;line-height:1.4}
.pick b{display:block;margin-top:4px;color:var(--r)}
.picks .empty{margin:0;font-size:12px;color:var(--sub);border:1px dashed var(--line);border-radius:12px;padding:14px;text-align:center}
.disc{color:var(--sub);font-size:11px;margin:8px 0 0;line-height:1.45}
.sheet .yt{margin:10px 0 0;font-size:11px;color:var(--sub);line-height:1.45}

/* 3D를 못 불러올 때: 평면 화면 (밖 → 로비 → 관 → 방) */
#flat{display:none;max-width:560px;margin:0 auto;padding:162px 16px 80px}
body.flat #flat{display:block}
body.flat #stage,body.flat .turn,body.flat .hint,body.flat .joy{display:none}
.warn{background:var(--paper);border:1px solid var(--line);border-radius:14px;padding:12px 14px;font-size:13px;line-height:1.55;color:var(--sub);margin-bottom:16px}
.warn button{margin-top:8px;border:0;background:var(--ink);color:#fff;border-radius:999px;padding:7px 14px;font-size:13px;min-height:34px}
.hero{border-radius:18px;overflow:hidden;background:linear-gradient(#bfe0f5,#fff3e0);padding:28px 16px 22px;text-align:center}
.hero .bld{margin:0 auto;max-width:300px;background:#efe9df;border-radius:6px 6px 0 0;padding:14px 10px 0;box-shadow:0 6px 0 #ddd3c3}
.hero .sign{display:inline-block;background:var(--ink);color:var(--y);font-weight:700;padding:6px 12px;border-radius:4px;font-size:14px}
.hero .cols{display:flex;justify-content:space-between;padding:14px 8px 0}
.hero .cols i{width:12px;height:70px;background:#f8f4ed;border-radius:3px}
.hero button{margin-top:22px;border:0;background:var(--ink);color:#fff;font-weight:700;font-size:16px;padding:12px 30px;border-radius:999px}
.sec{margin:20px 0 10px;font-size:14px;color:var(--sub);font-weight:700}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border:0;padding:0;text-align:left;background:var(--paper);border-radius:14px;overflow:hidden;box-shadow:0 2px 10px rgba(40,25,10,.08);color:var(--ink)}
.card .th{aspect-ratio:4/3;background:#e9dfcf center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--sub);font-size:13px;padding:8px;text-align:center}
.card .tt{padding:8px 10px 10px;font-size:13px;line-height:1.4;font-weight:600}
.card .tt small{display:block;font-weight:400;color:var(--sub);font-size:12px;margin-top:2px}
.card.blank{cursor:default;opacity:.75}
.card.blank .th{background:repeating-linear-gradient(45deg,#efe6d6 0 10px,#e9dfcf 10px 20px)}
.card.door .th{aspect-ratio:3/2;font-size:15px;font-weight:700;color:#fff;text-shadow:0 1px 3px rgba(0,0,0,.25)}
.card.door.lock{opacity:.55}
.card.ig .th{background:linear-gradient(135deg,#ff8fc4,#b48cff 60%,#ffb36b);color:#fff;font-weight:600}
@media (min-width:700px){.grid{grid-template-columns:repeat(3,1fr)}}
</style>
</head>
<body data-view="outside">
<div id="stage" tabindex="0" aria-label="3D 미술관"></div>

<a class="adtop" id="adTop" target="_blank" rel="sponsored noopener"></a>
<header class="top">
  <div class="bar">
    <div class="brand"><h1 id="hTitle"></h1><small id="hSub"></small></div>
    <select class="langSel" id="langSel" aria-label="Language">
      <option value="ko">한국어</option><option value="ja">日本語</option><option value="en">English</option><option value="zh">繁體中文</option>
    </select>
  </div>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="prog" id="prog"><i><b id="progBar"></b></i><span id="progText"></span></div>
</header>
<div class="side"><button id="colBtn" data-t="collection"></button><button class="mode" id="modeBtn"></button></div>

<div class="loading" id="loading"><div class="dots"><i></i><i></i><i></i></div><span data-t="loading"></span></div>
<div class="hint" id="hint"></div>
<div class="suggest" id="suggest"><span data-t="slowSuggest"></span><button id="sugYes" data-t="switchQuick"></button><button class="x" id="sugNo">✕</button></div>
<button class="enterBtn" id="enter" data-t="enter"></button>
<button class="turn l" id="turnL" data-t-aria="left">&#8592;</button>
<button class="turn r" id="turnR" data-t-aria="right">&#8594;</button>
<div class="joy" id="joy" aria-hidden="true"><i id="joyKnob"></i></div>
<button class="bubble" id="bubble"></button>

<main id="flat">
  <div class="warn"><span data-t="flatMsg"></span><br><button id="retry" data-t="retry"></button></div>
  <div id="fBody"></div>
</main>

<p class="note" data-t="embedNote"></p>
<div class="toast" id="toast"></div>
<div class="fade" id="fade"></div>

<section class="intro" id="intro" hidden>
  <div class="introBox" id="introBox"></div>
</section>

<div class="shade" id="shade"></div>
<section class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="vTitle" aria-hidden="true">
  <div class="grab"></div>
  <button class="close" id="close" data-t="close"></button>
  <div class="player" id="player"></div>
  <h2 id="vTitle"></h2>
  <p class="vnote" id="vNote"></p>
  <p class="desc" id="vDesc"></p>
  <div class="react" id="react" hidden><button id="likeBtn"></button><span id="likeN"></span></div>
  <div class="src" id="src" hidden><span id="srcName"></span><a id="srcLink" target="_blank" rel="noopener"></a></div>
  <div id="extra"></div>
  <div class="picks" id="picks">
    <h3 data-t="picksTitle"></h3>
    <div class="row" id="picksRow"></div>
    <p class="empty" id="picksEmpty" data-t="picksEmpty"></p>
    <p class="disc" id="disc" hidden>이 게시물은 쿠팡 파트너스 활동의 일환으로, 이에 따른 일정액의 수수료를 제공받습니다.</p>

function drawPetIcon(g, sp, S=56){
  const c=S/2, k=S/56; g.clearRect(0,0,S,S); g.save(); g.scale(k,k);
  const ear=sp.earColor||sp.body, tri=(x1,y1,x2,y2,x3,y3,f)=>{ g.fillStyle=f; g.beginPath(); g.moveTo(x1,y1); g.lineTo(x2,y2); g.lineTo(x3,y3); g.fill(); };
  if(sp.ear==="pointy"||sp.ear==="cat"){ tri(13,24,17,7,26,15,ear); tri(43,24,39,7,30,15,ear); if(sp.earIn){ tri(16,19,18,11,23,15,sp.earIn); tri(40,19,38,11,33,15,sp.earIn); } }
  if(sp.ear==="big"){ tri(11,26,14,3,27,14,ear); tri(45,26,42,3,29,14,ear); }
  g.fillStyle=sp.body; g.beginPath(); g.arc(28,31,17,0,7); g.fill();
  g.strokeStyle="rgba(40,30,20,.18)"; g.lineWidth=1.5; g.stroke();
  if(sp.ear==="floppy"||sp.ear==="fur"){ g.fillStyle=ear; for(const x of [12,44]){ g.beginPath(); g.ellipse(x,32,sp.ear==="fur"?7:6,sp.ear==="fur"?13:11,x<28?0.25:-0.25,0,7); g.fill(); g.stroke(); } }
  (sp.patches||[]).forEach(([col,x],i)=>{ g.fillStyle=col; g.beginPath(); g.arc(28+(x>0?7:x<0?-7:0)+(i?0:0), 19+i*2, 7, Math.PI*1.05, Math.PI*1.95); g.fill(); });
  if(sp.id==="cheese"){ g.strokeStyle="#df8a3a"; g.lineWidth=2; [[24,16],[28,15],[32,16]].forEach(([x,y])=>{ g.beginPath(); g.moveTo(x,y); g.lineTo(x,y+5); g.stroke(); }); }
  if(sp.belly){ g.fillStyle=sp.belly; g.beginPath(); g.ellipse(28,39,sp.kind==="cat"?9:10,7,0,0,7); g.fill(); }
  if(sp.shaggy){ g.fillStyle=sp.body; for(const [x,y,r] of [[12,40,7],[44,40,7],[20,46,6],[36,46,6]]){ g.beginPath(); g.arc(x,y,r,0,7); g.fill(); }
    g.fillStyle="#a3a9b2"; g.beginPath(); g.ellipse(28,25,15,8,0,0,7); g.fill(); }   // 눈을 덮는 앞머리
  else { g.fillStyle=sp.eye||"#2a2230"; g.beginPath(); g.arc(22,29,2.3,0,7); g.arc(34,29,2.3,0,7); g.fill(); }
  if(sp.kind==="dog"){ g.fillStyle=sp.body==="#2e2a2c"?"#6b5a5a":"#2a2230"; g.beginPath(); g.ellipse(28,35,3,2.2,0,0,7); g.fill(); }
  else { g.fillStyle="#f29bb5"; tri(25.5,34,30.5,34,28,37,"#f29bb5"); g.strokeStyle="rgba(60,50,60,.35)"; g.lineWidth=1; [[18,36,10,35],[18,38,10,40],[38,36,46,35],[38,38,46,40]].forEach(([a,b,cx,d])=>{ g.beginPath(); g.moveTo(a,b); g.lineTo(cx,d); g.stroke(); }); }
  g.restore();
}

const safeUrl = u => { try{ const x=new URL(u); return x.protocol==="https:" ? x : null; }catch(e){ return null; } };
/* 브라우저 저장: 막혀 있어도(사생활 보호 창 등) 화면은 그대로 동작 */
const store = {
  get(k){ try{ return localStorage.getItem(k); }catch(e){ return null; } },
  set(k,v){ try{ localStorage.setItem(k,v); }catch(e){} },
  json(k, d){ try{ const v=JSON.parse(localStorage.getItem(k)); return v ?? d; }catch(e){ return d; } },
  put(k, v){ try{ localStorage.setItem(k, JSON.stringify(v)); }catch(e){} },
};
const qs = new URLSearchParams(location.search);

/* ---------- 추천·열람 집계 어댑터 ----------
   STATS.record(videoId, "view"|"like")  → 한 번 세기
   STATS.get(videoId) → Promise<{view, like}>
   STATS.hasLiked(videoId) / STATS.markLiked(videoId) → 이 방문자가 이미 추천했는지(영상별 1회)
   local 저장 형식: localStorage["duksim-stats-v1"] = {"<videoId>":{"view":n,"like":n}}
                    localStorage["duksim-liked-v1"] = ["<videoId>", ...] */
const STATS_LOCAL = {
  record(id, kind){ const s=store.json("duksim-stats-v1",{}); const r=s[id]||(s[id]={view:0,like:0}); r[kind]=(r[kind]||0)+1; store.put("duksim-stats-v1",s); },
  async get(id){ const r=store.json("duksim-stats-v1",{})[id]; return {view:r?.view||0, like:r?.like||0}; },
};
const STATS_FIREBASE = {   // TODO: FIREBASE_CONFIG가 생기면 Firestore 문서 stats/<videoId> 에 {view, like}를 increment로 더하고 읽는다
  record(id, kind){ STATS_LOCAL.record(id, kind); },
  async get(id){ return STATS_LOCAL.get(id); },
};
const STATS = {
  mode: FIREBASE_CONFIG ? "firebase" : "local",
  record(id, kind){ (this.mode==="firebase" ? STATS_FIREBASE : STATS_LOCAL).record(id, kind); },
  get(id){ return (this.mode==="firebase" ? STATS_FIREBASE : STATS_LOCAL).get(id); },
  hasLiked(id){ return store.json("duksim-liked-v1",[]).includes(id); },
  markLiked(id){ const a=store.json("duksim-liked-v1",[]); if(!a.includes(id)){ a.push(id); store.put("duksim-liked-v1",a); } },
};

/* ---------- 진행 저장 어댑터(나중에 Firebase 계정별로 옮길 수 있게) ----------
   PROG.list(hall, room) → 시청 완료한 영상 id 배열,  PROG.add(hall, room, videoId) → 새로 인정되면 true
   PROG.hallCleared(hall) / PROG.setHallCleared(hall)
   local 저장 형식: localStorage["duksim-progress-v1"] = {"watched":{"<hall>":{"<room>":["videoId",…]}}, "cleared":{"<hall>":"YYYY-MM-DD"}} */
const PROG_LOCAL = {
  load(){ const d=store.json("duksim-progress-v1",{}); d.watched ||= {}; d.cleared ||= {}; return d; },
  save(d){ store.put("duksim-progress-v1", d); },
};
const PROG_FIREBASE = PROG_LOCAL;   // TODO: FIREBASE_CONFIG가 생기면 로그인 계정 문서 progress/<uid> 로 읽고 쓰기
const PROG = {
  get b(){ return FIREBASE_CONFIG ? PROG_FIREBASE : PROG_LOCAL; },
  list(h, r){ return this.b.load().watched[h]?.[r] || []; },
  add(h, r, id){ const d=this.b.load(); const a=((d.watched[h] ||= {})[r] ||= []); if(a.includes(id)) return false; a.push(id); this.b.save(d); return true; },
  hallCleared(h){ return !!this.b.load().cleared[h]; },
  setHallCleared(h){ const d=this.b.load(); d.cleared[h] ||= new Date().toISOString().slice(0,10); this.b.save(d); },
};

const G = window.Gallery = {
  HALLS, MISSIONS, STATS, style: (qs.get("style")==="museum"||qs.get("style")==="classic") ? qs.get("style") : BUILDING_STYLE,
  lang:"ko", view:"outside", hallId:null, roomId:null, mode:"loading", langHooks:[], walk:false, char:"capsule",
  t(k, v){ let s=(I18N[this.lang]||I18N.ko)[k] ?? I18N.ko[k] ?? k; if(v) for(const x in v) s=s.replace("{"+x+"}", v[x]); return s; },
  nm(o){ return o ? (o[this.lang] || o.en || o.ko || "") : ""; },
  hall(id=this.hallId){ return HALLS.find(h=>h.id===id); },
  room(hid=this.hallId, rid=this.roomId){ return this.hall(hid)?.rooms?.find(r=>r.id===rid); },
  frames(room){ const v=(room?.videos||[]).slice(0,FRAMES_PER_ROOM); while(v.length<FRAMES_PER_ROOM) v.push(null); return v; },
  roomTitle(room){ return room?.theme ? (this.lang==="ko" ? room.theme.title : this.t("bday",{m:room.theme.memberEn||room.theme.member})) : this.nm(room?.name); },
  /* 방 이야기: story(우리가 쓴 글)가 있으면 그 글, 없으면 한 줄 설명(desc → 영상 수) */
  roomStory(room){ const f=v=> !v ? "" : typeof v==="object" ? this.nm(v) : String(v);
    return { text:f(room?.story).trim(), line:f(room?.desc).trim() || (room?.videos?.length ? this.t("videosN",{n:room.videos.length}) : this.t("soon")) }; },
  roomColor(room){ return room?.theme?.color || room?.color || "#9db8e8"; },
  PROG,
  inProgress(h){ return PROGRESS.enabled && h?.id===PROGRESS.hall; },
  roomNeed(r){ const n=r?.need ?? PROGRESS.need[r?.id] ?? PROGRESS.need.default ?? 3; return Math.min(n, r?.videos?.length||0); },
  roomCount(h, r){ const ids=new Set((r.videos||[]).map(v=>v.id)); return PROG.list(h.id, r.id).filter(id=>ids.has(id)).length; },
  roomCleared(h, r){ return this.roomCount(h, r) >= this.roomNeed(r); },
  roomOpen(h, r){ if(!this.inProgress(h)) return true; if(r.hidden) return this.hallCleared(h);
    const i=PROGRESS.order.indexOf(r.id); if(i<0 || i<PROGRESS.openAtStart) return true;
    const prev=h.rooms.find(x=>x.id===PROGRESS.order[i-1]); return !prev || this.roomCleared(h, prev); },
  prevRoom(h, r){ const i=PROGRESS.order.indexOf(r.id); return h.rooms.find(x=>x.id===PROGRESS.order[i-1]); },
  lockedText(h, r){ const pr=this.prevRoom(h, r); if(!pr) return this.t("locked"); return this.t("lockedRoom",{room:this.nm(pr.name), n:this.roomNeed(pr)-this.roomCount(h, pr)}); },
  orderRooms(h){ return PROGRESS.order.map(id=>h.rooms.find(r=>r.id===id)).filter(Boolean); },
  hallCleared(h){ if(!this.inProgress(h)) return false; return PROG.hallCleared(h.id) || this.orderRooms(h).every(r=>this.roomCleared(h, r)); },
  visibleRooms(h){ return (h?.rooms||[]).filter(r=>!r.hidden || (this.inProgress(h) ? this.hallCleared(h) : false)).sort((a,b)=>(!!a.hidden)-(!!b.hidden)); },
  stars(a, b){ return "★".repeat(Math.min(a,b))+"☆".repeat(Math.max(0,b-a)); },
  /* 퀴즈 안전장치: 출처·확인 날짜가 없으면 숨김 */
  missions(hid, rid){ return MISSIONS.filter(m => m.hall===hid && m.room===rid && (m.type!=="quiz" || (safeUrl(m.source) && m.checked_at))); },
};

/* ---------- curation.json (있으면 방 액자를 채움, 없으면 HALLS 그대로) ----------
   형식: {"themes":[{"id":"stage","name":"뮤직비디오","hall"?:"rescene","videos":[{"video_id","title","kind","channel"?,"official"?,"added_at"?}]}]} */
G.curationReady = (async () => {
  try{
    const res = await fetch("curation.json", {cache:"no-store"});
    if(!res.ok) return false;
    const data = await res.json(); if(!Array.isArray(data?.themes)) return false;
    const DECORS=["stage","cozy","studio","youtube","daily","birthday","plain"];
    for(const t of data.themes){
      const hall = HALLS.find(h => t.hall ? h.id===t.hall : h.curation); if(!hall || !t.id) continue;
      const vids = (t.videos||[]).map(v => ({ id:String(v.video_id||v.id||""), title:String(v.title||""), desc:String(v.desc||v.description||""), note:String(v.note||""),
        kind: v.kind==="short" ? "short" : "long", official: !!v.official, channel: v.channel ? String(v.channel) : "",
        added_at: String(v.added_at||""), picks: Array.isArray(v.picks)?v.picks:[] })).filter(v => /^[\w-]{11}$/.test(v.id));
      let room = hall.rooms.find(r => r.id===t.id);
      if(!room){ room = {id:String(t.id), name:{ko:String(t.name||t.id)}, decor: DECORS.includes(t.decor)?t.decor:"plain", color:"#c8b6e8", videos:[]}; hall.rooms.push(room); }
      if(vids.length) room.videos = vids;
      if(t.story) room.story = t.story; if(t.desc) room.desc = t.desc;
    }
    console.info("[미술관] curation.json 반영:", data.themes.length, "개 테마");
    return true;
  }catch(e){ return false; }
})();

G.curationReady.then(()=>{ const h=HALLS.find(x=>x.id===PROGRESS.hall), sr=h?.rooms.find(r=>r.id===PROGRESS.secretRoom); if(!sr) return;
  MISSIONS.filter(m=>m.hall===h.id && /^[\w-]{11}$/.test(m.reward?.video_id||"")).forEach(m=>{ if(!sr.videos.some(v=>v.id===m.reward.video_id)) sr.videos.push({id:m.reward.video_id, title:m.reward.title||"", kind:m.reward.kind||"long", official:true, desc:""}); }); });

/* ---------- 화면 이동 ---------- */
G.go = (view, hallId=G.hallId, roomId=null) => {
  if(view==="shop"){ const sg=SHOP_GROUPS.find(x=>x.id===hallId); if(!sg?.open){ toast(G.t("locked")); return; } }
  if(view==="hub" || view==="room"){ const h=G.hall(hallId); if(!h || !h.open){ toast(G.t("lockedToast")); return; } }
  if(view==="room"){ const h=G.hall(hallId), r=G.room(hallId, roomId); if(!r || !G.visibleRooms(h).includes(r)) return; if(!G.roomOpen(h, r)){ toast(G.lockedText(h, r), 2400); return; } }
  if(G.mode==="3d" && G.go3d) G.go3d(view, hallId, roomId); else G.applyView(view, hallId, roomId);
};
G.applyView = (view, hallId=null, roomId=null) => {
  G.view=view; G.shopGroup = view==="shop" ? hallId : null; G.hallId = view==="outside"||view==="lobby"||view==="shop" ? null : hallId; G.roomId = view==="room" ? roomId : null;
  document.body.dataset.view = view;
  document.documentElement.style.setProperty("--theme", view==="room" ? G.roomColor(G.room()) : view==="shop" ? (G.shopG()?.color||"#ff9ad5") : (G.hall()?.color || "#9db8e8"));
  try{ history.replaceState(null, "", location.pathname + location.search + (view==="shop" ? "#/shop/"+G.shopGroup : G.hallId ? "#/"+G.hallId+(G.roomId?"/"+G.roomId:"") : view==="lobby" ? "#/lobby" : "")); }catch(e){}
  if(view==="room") markVisit(G.hallId, G.roomId);
  drawChrome(); drawFlat(); showHint();
  if(G.mode==="flat") scrollTo(0,0);
};
function drawChrome(){
  const h=G.hall(), r=G.room(), v=G.view;
  $("#hTitle").textContent = v==="room" ? G.roomTitle(r) : v==="hub" ? G.nm(h.name) : v==="shop" ? G.t("shopOf",{g:G.nm(G.shopG()?.name)}) : G.t("gallery");
  $("#hSub").textContent = v==="room" ? G.nm(h.name)+" · "+G.nm(r.name) : v==="hub" ? G.t("subHub") : v==="shop" ? G.t("shopSub") : v==="lobby" ? G.t("subLobby") : G.t("subOut");
  document.title = $("#hTitle").textContent + (v==="outside"||v==="lobby" ? "" : " · " + G.t("gallery"));
  let html="";
  if(v==="shop") html = `<button class="back" data-go="lobby">← ${esc(G.t("toLobby"))}</button>` + SHOP_GROUPS.map(x=>`<button data-shop="${esc(x.id)}" class="${x.id===G.shopGroup?'on':''} ${x.open?'':'lock'}">${esc(G.nm(x.name))}${x.open?'':' · '+esc(G.t("locked"))}</button>`).join("") + `<button data-seller="1">🏪 ${esc(G.t("bSeller"))}</button>`;
  if(v==="lobby") html = HALLS.map(x=>`<button data-hall="${esc(x.id)}" class="${x.open?'':'lock'}">${esc(G.nm(x.name))}${x.open?'':' · '+esc(G.t("locked"))}</button>`).join("") + `<button data-shoppick="1">🛍 ${esc(G.t("shop"))}</button>`;
  const rb = x => `<button data-room="${esc(x.id)}" class="${x.id===G.roomId?'on':''} ${G.roomOpen(h,x)?'':'lockr'}">${G.roomOpen(h,x)?'':'🔒 '}${esc(G.nm(x.name))}</button>`;
  if(v==="hub") html = `<button class="back" data-go="lobby">← ${esc(G.t("toLobby"))}</button>` + G.visibleRooms(h).map(rb).join("");
  if(v==="room") html = `<button class="back" data-go="hub">← ${esc(G.t("toHub"))}</button>` + G.visibleRooms(h).map(rb).join("");
  const c=$("#crumbs"); c.innerHTML=html; wireNav(c); drawProgress();
  $("#modeBtn").textContent = G.walk ? G.t("modeWalk") : G.t("modeQuick");
}
function wireNav(box){
  box.querySelectorAll("[data-go]").forEach(b=>b.onclick=()=>G.go(b.dataset.go));
  box.querySelectorAll("[data-hall]").forEach(b=>b.onclick=()=>G.go("hub", b.dataset.hall));
  box.querySelectorAll("[data-shop]").forEach(b=>b.onclick=()=>{ if(b.dataset.shop!==G.shopGroup) G.go("shop", b.dataset.shop); });
  box.querySelectorAll("[data-shoppick]").forEach(b=>b.onclick=()=>G.openShopPicker());
  box.querySelectorAll("[data-seller]").forEach(b=>b.onclick=()=>G.openSeller());
  box.querySelectorAll("[data-room]").forEach(b=>b.onclick=()=>{ if(b.dataset.room!==G.roomId) G.go("room", G.hallId, b.dataset.room); });
}

function drawProgress(){
  const h=G.hall(), el=$("#prog"), on=!!h && G.inProgress(h) && (G.view==="hub"||G.view==="room"); el.classList.toggle("on", on); if(!on) return;
  const rs=G.orderRooms(h), a=rs.filter(r=>G.roomCleared(h,r)).length;

}

/* ---------- 방문 도장·수집함 (브라우저 저장) ---------- */
function markVisit(hid, rid){
  const v=store.json("duksim-visits-v1",{}); const a=v[hid]||(v[hid]=[]); if(a.includes(rid)) return;
  a.push(rid); store.put("duksim-visits-v1",v);
  const h=G.hall(hid); const all=G.visibleRooms(h).filter(r=>!r.hidden).every(r=>a.includes(r.id));
  const badges=store.json("duksim-badges-v1",[]);
  if(all && !badges.includes(hid)){ badges.push(hid); store.put("duksim-badges-v1",badges); setTimeout(()=>toast(G.t("badgeToast",{hall:G.nm(h.name)}),2600),700); }
}
function openCollection(){
  const v=store.json("duksim-visits-v1",{}), badges=store.json("duksim-badges-v1",[]), col=store.json("duksim-collection-v1",{});
  const rows=[];

/* 유튜브 IFrame Player API(공식 스크립트)로 재생 상태를 받아 '시청 완료' 판정. 못 쓰면 패널을 fallbackSeconds초 열어 두면 인정 */
let ytPromise=null, watch=null;
function loadYT(){
  if(window.YT?.Player) return Promise.resolve(window.YT);
  return ytPromise ||= new Promise((res, rej)=>{
    const prev=window.onYouTubeIframeAPIReady; window.onYouTubeIframeAPIReady=()=>{ prev?.(); res(window.YT); };
    const sc=document.createElement("script"); sc.src="https://www.youtube.com/iframe_api"; sc.async=true; sc.onerror=()=>{ ytPromise=null; rej(new Error("iframe_api")); };
    document.head.appendChild(sc); setTimeout(()=>rej(new Error("timeout")), 8000); });
}
function stopWatch(){ if(!watch) return; watch.timers.forEach(clearInterval); watch=null; }
function startWatch(it){
  stopWatch();
  const h=G.hall(), r=G.room();
  if(G.view!=="room" || !h || !r || !G.inProgress(h) || !(r.videos||[]).some(v=>v.id===it.id) || PROG.list(h.id,r.id).includes(it.id)) return;
  const w=watch={short:it.kind==="short", played:0, playing:false, done:false, api:false, opened:Date.now(), timers:[]};
  const credit=()=>{ if(w.done) return; w.done=true; creditWatch(h, r, it.id); };
  w.timers.push(setInterval(()=>{ if(watch!==w) return;
    if(w.playing){ w.played++; if(!w.short && w.played>=PROGRESS.watchSeconds) credit(); }
    if(!w.api && Date.now()-w.opened >= PROGRESS.fallbackSeconds*1000) credit(); }, 1000));
  loadYT().then(YT=>{ const el=document.getElementById("ytFrame"); if(watch!==w || !el) return;
    w.player=new YT.Player(el, {events:{ onReady:()=>{ w.api=true; }, onStateChange:e=>{ w.api=true; w.playing = e.data===1; if(e.data===0) credit(); } }}); }).catch(()=>{});
}
function creditWatch(h, r, id){
  const was=G.roomCleared(h, r), hallWas=G.hallCleared(h);
  if(!PROG.add(h.id, r.id, id)) return;
  toast(G.t("watchedOk",{s:G.stars(G.roomCount(h,r), G.roomNeed(r))}));
  if(!was && G.roomCleared(h, r)){
    const i=PROGRESS.order.indexOf(r.id), nx=PROGRESS.order[i+1];
    if(nx && i+1>=PROGRESS.openAtStart) G.justUnlocked=nx;
    setTimeout(()=>toast(G.t(nx ? "roomClear" : "roomClearLast"), 2200), 1800);
  }
  if(!hallWas && G.hallCleared(h)){ PROG.setHallCleared(h.id); G.justUnlocked=PROGRESS.secretRoom; setTimeout(()=>toast(G.t("hallClear",{hall:G.nm(h.name)}), 3000), 4200); }
  drawChrome(); drawFlat(); G.onProgress?.();
}

<script type="module">

function start(THREE){

  function wrapText(g, text, x, y, maxW, lineH, maxLines){

    if(npc){   // 로비 간판(한글 크게 + 작은 외국어) · 중형 전광판 · 한국 문화 코너
      const sg=new THREE.Group(); sg.position.set(0,0,-(R-0.12)); sg.lookAt(0,0,0); s.add(sg);
      const sign=textPlane(sg, 3.0, 0.62, 640, (g,W,H)=>{ g.fillStyle="#1e143c"; g.fillRect(0,0,W,H); g.strokeStyle="#c9a45c"; g.lineWidth=5; g.strokeRect(5,5,W-10,H-10);
        g.fillStyle="#ffd640"; g.textAlign="center"; g.textBaseline="middle"; g.font=`800 58px ${FONT}`; g.fillText("덕심저장소 갤러리",W/2,H*0.42);
        g.fillStyle="#e8e0ff"; g.font=`500 17px ${FONT}`; g.fillText(G.t("lobbySub"),W/2,H*0.8); });
      sign.position.set(0,3.72,0); relabel.push(sign.userData.redraw);
      const fn=textPlane(sg, 3.6, 0.2, 720, (g,W,H)=>{ g.fillStyle="#fffaf2"; g.fillRect(0,0,W,H); g.fillStyle="#6b6280"; g.font=`500 19px ${FONT}`; g.textAlign="center"; g.textBaseline="middle"; wrapText(g,G.t("freeNote"),W/2,H/2+1,W-20,22,1); });
      fn.position.set(0,3.24,0); relabel.push(fn.userData.redraw);
      const ba=2.25, bg=new THREE.Group(); bg.position.set(Math.sin(ba)*(R-0.3),2.3,-Math.cos(ba)*(R-0.3)); bg.lookAt(0,2.3,0); s.add(bg);
      billboard(s, bg, 2.8, 1.4, "lobby_billboard", clickables, spots, new THREE.Vector3(Math.sin(ba)*(R-1.4),1.6,-Math.cos(ba)*(R-1.4)));
      const ca=-2.25, cx=Math.sin(ca)*(R-1.0), cz=-Math.cos(ca)*(R-1.0), cg=new THREE.Group(); cg.position.set(cx,0,cz); cg.lookAt(0,0,0); s.add(cg);
      box(cg, 1.6,0.7,0.6, lam(0xeadcc6), 0,0.35,0);
      instanced(cg, new THREE.CylinderGeometry(0.16,0.18,0.3,10), lam(0xfffaf2), [-0.5,0,0.5].map(x=>({x,y:0.85,z:0})));
      const cs=textPlane(cg, 1.6, 0.42, 384, (g,W,H)=>label(g,W,H,"#fffdf8","#1e143c","🇰🇷 "+G.t("culture"),G.t("cultureSoon"),40)); cs.position.set(0,1.45,0.05); relabel.push(cs.userData.redraw);
      [cs].forEach(m=>{ m.userData.act=G.openCulture; clickables.push(m); });
      spots.push({p:new THREE.Vector3(Math.sin(ca)*(R-2.0),1.2,-Math.cos(ca)*(R-2.0)), r:1.4, label:()=>G.t("bCulture"), act:G.openCulture});
      culturePos=[cx,cz];
    }
    const back=new THREE.Group(); back.position.set(0,0,R-0.2); back.lookAt(0,0,0); s.add(back);
    const bf=lam(0x7a5a3a); box(back,0.14,2.9,0.14,bf,-1.15,1.45,0); box(back,0.14,2.9,0.14,bf,1.15,1.45,0); box(back,2.44,0.16,0.14,bf,0,2.92,0);
    const bp=add(back, new THREE.PlaneGeometry(2.16,2.84), new THREE.MeshBasicMaterial({map: outdoorBack ? skyTex() : doorGlow()}), 0, 1.42, -0.02);
    const bs=textPlane(back, 1.8, 0.42, 320, (g,w,h)=>label(g,w,h,"#1e143c","#ffd640", "← "+backLabel(), "", 40)); bs.position.set(0,3.3,0); relabel.push(bs.userData.redraw);
    [bp,bs].forEach(m=>{ m.userData.act=onBack; clickables.push(m); });
    spots.push({p:new THREE.Vector3(0,1.9,R-0.9), r:1.2, label:()=>"← "+backLabel(), act:onBack});
    const blockers=[];
    if(npc){   // 안내 NPC(로비): 반짝이 — 리본 단 흰 고양이
      const g=petMesh(NPC_PET,1.7); g.position.set(2.2,0,2.4); g.rotation.y=Math.PI*0.8; s.add(g);
      g.traverse(o=>{ if(o.isMesh){ o.userData.act=G.talkNpc; clickables.push(o); } });
      spots.push({p:new THREE.Vector3(2.2,1.6,2.4), r:1.8, label:()=>G.t("bTalk")+" · "+G.t("npc"), act:G.talkNpc});
      blockers.push({c:[2.2,2.4,0.55]});
      if(culturePos) blockers.push({c:[culturePos[0],culturePos[1],0.9]});
    }
    after?.();
    const jIdx=doors.findIndex(d=>d.justOpened), first = jIdx>=0 ? angles[jIdx]/0.35 : (angles[doors.findIndex(d=>d.open)] ?? 0);
    return {scene:s, clickables, relabel, spots, cam:{pos:[0,1.7,3.4], yaw:-first*0.35, pitch:0.0, zoom:1.12},
      walk:{spawn:[0,R-1.8,0], free:(x,z)=>Math.hypot(x,z)<R-0.75 && !inCircles(x,z,blockers), camDist:2.8, camH:1.9, clampR:R-0.25}};
  }
  function buildLobby(){
    return buildRotunda({ color:"#c9a45c", outdoorBack:true, npc:true, adPlace:"lobby_top", backLabel:()=>G.t("exit"), onBack:()=>G.go("outside"),
      doors: HALLS.map(h=>({ color:h.color, open:h.open, title:()=>G.nm(h.name),
        sub:()=> h.open ? G.t("videosN",{n:h.rooms.reduce((a,r)=>a+(r.videos?.length||0),0)}) : (h.id===PROGRESS.nextHall && HALLS.some(x=>x.id===PROGRESS.hall && G.hallCleared(x)) ? "🏆 "+G.t("clearReward") : G.t("locked")),
        act:()=> h.open ? G.go("hub",h.id) : G.toast(G.t("lockedToast")) })).concat([{ color:"#ff9ad5", open:true, title:()=>"🛍 "+G.t("shop"), sub:()=>G.t("pickIdol"), act:()=>G.openShopPicker() }]) });
  }
  function buildHub(hall){
    return buildRotunda({ color:hall.color, adPlace:"hall_top", backLabel:()=>G.t("toLobby"), onBack:()=>G.go("lobby"),
      doors: G.visibleRooms(hall).map(r=>{ const op=G.roomOpen(hall,r), nd=G.roomNeed(r), jo=G.justUnlocked===r.id;
        return { color:G.roomColor(r), open:op, justOpened:jo, title:()=>G.nm(r.name),
          sub:()=> !op ? (()=>{ const pr=G.prevRoom(hall,r); return G.t("lockedLeft",{n:pr?G.roomNeed(pr)-G.roomCount(hall,pr):0}); })()
                  : (G.inProgress(hall)&&nd ? G.stars(G.roomCount(hall,r),nd)+"  " : "") + (r.videos?.length ? G.t("videosN",{n:r.videos.length}) : G.t("soon")),
          lockLabel:()=>G.lockedText(hall,r),
          act:()=>G.go("room",hall.id,r.id) }; }), after:()=>{ G.justUnlocked=null; } });
  }

  /* ==========================================================
     3) 방 — 액자 7개 + 방마다 다른 꾸밈(도형만) + 미션
     ========================================================== */
  const DECOR = {
    plain:  {wall:0xf4ecdf, floor:["#d7b98f","#cfae82"], ceil:0xf7f1e6, base:0xcdb998},
    stage:  {wall:0x3a3158, floor:["#2b2540","#262036"], ceil:0x1f1a30, base:0x55487e, hemi:[0xd9ccff,0x3a3158,1.6]},
    cozy:   {wall:0xf6e6d2, floor:["#c99a6b","#bf8f60"], ceil:0xfbf3e8, base:0xb98a5e},
    studio: {wall:0xf4f8fc, floor:["#e3e9ef","#d9e1e8"], ceil:0xffffff, base:0xb8c7d6, hemi:[0xffffff,0xdfe8f0,2.8]},
    youtube:{wall:0xfbf1f0, floor:["#e9e1dc","#e1d8d2"], ceil:0xffffff, base:0xd9b8b4},
    daily:  {wall:0xf0f6ec, floor:["#d9c29c","#d0b890"], ceil:0xfbfdf8, base:0xb9cfa8},
    birthday:{wall:0xf4ecdf, floor:["#d7b98f","#cfae82"], ceil:0xf7f1e6, base:0xcdb998},
  };
  function buildRoom(hall, room){
    const D = DECOR[room.decor] || DECOR.plain, color=G.roomColor(room), theme=room.theme, dec=room.decor;
    const s=new THREE.Scene(); s.background=new THREE.Color(D.wall); hemi(s, ...(D.hemi||[0xfff8ee,0xf0dfc2,2.6]));
    const W=6, H=4.2, clickables=[], relabel=[], frames=[], spots=[], blockers=[], boxes=[];
    const floorTex=canvasTex(256,256,(g,w,h)=>{ for(let i=0;i<8;i++){ g.fillStyle=D.floor[i%2]; g.fillRect(0,i*32,w,32); g.fillStyle="rgba(80,50,20,.14)"; g.fillRect(0,i*32,w,1.5); g.fillRect((i*97)%w,i*32,1.5,32); } });
    floorTex.wrapS=floorTex.wrapT=THREE.RepeatWrapping; floorTex.repeat.set(4,4);
    add(s, new THREE.PlaneGeometry(W*2,W*2), new THREE.MeshLambertMaterial({map:floorTex})).rotation.x=-Math.PI/2;
    add(s, new THREE.PlaneGeometry(W*2,W*2), bas(D.ceil), 0, H, 0).rotation.x=Math.PI/2;
    const wallMat=lam(D.wall), baseMat=lam(D.base), woodMat=lam(dec==="stage"?0x1a1626:0x9a7448), matMat=bas(0xfffdf8);
    const glowMat=new THREE.MeshBasicMaterial({map:canvasTex(128,128,(g,w,h)=>{ const r=g.createRadialGradient(w/2,6,2,w/2,6,w/2); r.addColorStop(0,"rgba(255,236,190,.75)"); r.addColorStop(1,"rgba(255,236,190,0)"); g.fillStyle=r; g.fillRect(0,0,w,h); }),transparent:true,depthWrite:false});
    const WALLS=[0,-Math.PI/2,Math.PI,Math.PI/2];                  // 앞, 오른쪽, 뒤, 왼쪽(보는 사람 기준)
    const pivots=WALLS.map(a=>{ const p=new THREE.Group(); p.rotation.y=a; s.add(p);
      add(p, new THREE.PlaneGeometry(W*2,H), wallMat, 0, H/2, -W); box(p, W*2,0.14,0.04, baseMat, 0,0.07,-W+0.02); return p; });
    const onWall = (wi, x, y, z=0.03) => new THREE.Vector3(x,y,-W+z).applyAxisAngle(Y, WALLS[wi]);

    /* 벽 위쪽 광고판 줄(천장 바로 아래): 앞 3칸 + 오른쪽 4칸 + 왼쪽 4칸 */
    { let n=0; [[0,[-3.4,0,3.4]],[1,[-4.2,-1.4,1.4,4.2]],[3,[-4.2,-1.4,1.4,4.2]]].forEach(([wi,xs])=>xs.forEach(x=>{ const g=new THREE.Group(); g.position.set(x,3.92,-W+0.04); pivots[wi].add(g); adPanel(g, 2.5, 0.4, `room_top_${++n}`, clickables, relabel); })); }

    /* 뒤 벽: 관 홀로 가는 문 */
    { const p=pivots[2], back=()=>G.go("hub",hall.id);
      box(p, 2.0,2.75,0.05, woodMat, 0,1.37,-W+0.005);
      const door=add(p, new THREE.PlaneGeometry(1.8,2.6), new THREE.MeshBasicMaterial({map:doorGlow()}), 0,1.3,-W+0.04);
      const sign=textPlane(p, 1.6, 0.38, 320, (g,w,h)=>label(g,w,h,"#1e143c","#ffd640","← "+G.t("toHub"),"",40)); sign.position.set(0,2.35,-W+0.06); relabel.push(sign.userData.redraw);
      [door,sign].forEach(m=>{ m.userData.act=back; clickables.push(m); });
      spots.push({p:onWall(2,0,1.9,1.0), r:1.3, label:()=>"← "+G.t("toHub"), act:back}); }

    /* 입구 벽(뒤 벽) 문 위: 방 이야기 큰 안내판. story가 없으면 방 이름 + 한 줄 설명만. 누르면 글 전체 */
    { const p=pivots[2], st=()=>G.roomStory(room);
      const board=textPlane(p, 3.6, 1.14, 512, (g,w,h)=>{ const s0=st(); g.fillStyle="#fffdf8"; g.fillRect(0,0,w,h); g.fillStyle=color; g.fillRect(0,0,w,10); g.fillRect(0,h-4,w,4);
        g.strokeStyle="#e4d8c4"; g.lineWidth=3; g.strokeRect(1.5,1.5,w-3,h-3);
        g.fillStyle="#1e143c"; g.textAlign="center"; g.textBaseline="middle"; g.font=`800 30px ${FONT}`; g.fillText(G.nm(room.name), w/2, s0.text ? 36 : h*0.4);
        g.fillStyle="#4a4060"; g.font=`500 ${s0.text?17:20}px ${FONT}`;
        if(s0.text){ const lines=s0.text.split(/\n/).slice(0,4); let y=68; lines.forEach(l=>{ wrapText(g, l, w/2, y, w-44, 22, 2); y+= g.measureText(l).width>w-44 ? 44 : 23; }); }
        else wrapText(g, s0.line, w/2, h*0.68, w-44, 24, 1); });
      board.position.set(0,3.36,-W+0.05); relabel.push(board.userData.redraw);
      board.userData.act=()=>{ const s0=G.roomStory(room); G.openItem({type:"text", title:G.nm(room.name), desc:s0.text||s0.line}); }; clickables.push(board); }

    /* 앞 벽 위: 방 이름(생일카페는 현수막) */
    if(dec==="birthday"){
      const ban=textPlane(pivots[0], 3.4, 0.5, 640, (g,w,h)=>{ g.fillStyle=color; g.fillRect(0,0,w,h-12);
        for(let x=0;x<w;x+=32){ g.beginPath(); g.moveTo(x,h-12); g.lineTo(x+16,h); g.lineTo(x+32,h-12); g.fill(); }
        g.fillStyle="#ffffff"; g.textAlign="center"; g.textBaseline="middle"; g.font=`800 52px ${FONT}`;
        g.fillText(`HAPPY ${(theme?.memberEn||theme?.member||"").toUpperCase()} DAY`, w/2, theme?.date ? 34 : (h-12)/2+2);
        if(theme?.date){ g.font=`600 20px ${FONT}`; g.fillText(theme.date, w/2, 70); } });
      ban.position.set(0,2.84,-W+0.09);
    } else {
      const t=textPlane(pivots[0], 2.6, 0.46, 448, (g,w,h)=>label(g,w,h, dec==="stage"?"#1e143c":"#fffdf8", dec==="stage"?color:"#1e143c", G.nm(room.name), "", 46));
      t.position.set(0,3.2,-W+0.05); relabel.push(t.userData.redraw);
    }

    /* 액자 7개: 앞 3(가운데가 첫 영상) + 오른쪽 2 + 왼쪽 2 */
    const SLOT_POS=[[0,0],[0,-3.4],[0,3.4],[1,-2],[1,2],[3,-2],[3,2]];
    const loader=new THREE.TextureLoader(); loader.setCrossOrigin("anonymous");
    const emptyTex=()=>canvasTex(256,192,(g,w,h)=>{ g.fillStyle=dec==="stage"?"#4a4068":"#efe5d4"; g.fillRect(0,0,w,h); g.strokeStyle=dec==="stage"?"#6a5f90":"#d8c8ad"; g.setLineDash([8,6]); g.lineWidth=3; g.strokeRect(14,14,w-28,h-28);
      g.fillStyle=dec==="stage"?"#cfc4f0":"#9a8a70"; g.font=`600 26px ${FONT}`; g.textAlign="center"; g.textBaseline="middle"; g.fillText(G.t("soon"),w/2,h/2); });
    const titleTex=(v,portrait)=>{ const w=portrait?192:256, h=portrait?340:192; return canvasTex(w,h,g=>{ const gr=g.createLinearGradient(0,0,w,h); gr.addColorStop(0,color); gr.addColorStop(1,"#ff465a"); g.fillStyle=gr; g.fillRect(0,0,w,h);
      g.fillStyle="#fff"; g.font=`700 24px ${FONT}`; g.textAlign="center"; g.textBaseline="middle"; wrapText(g,v.title,w/2,h/2,w-32,32,5); }); };
    const labelTex=text=>canvasTex(512,96,(g,w,h)=>{ g.fillStyle="#fffdf8"; g.fillRect(0,0,w,h); g.strokeStyle="#e4d8c4"; g.lineWidth=4; g.strokeRect(2,2,w-4,h-4);
      g.fillStyle="#1e143c"; g.font=`600 32px ${FONT}`; g.textAlign="center"; g.textBaseline="middle"; wrapText(g,text,w/2,h/2+1,w-36,36,1); });
    let alive=true;
    function ytTexture(id, onTex){ loader.load(`https://i.ytimg.com/vi/${encodeURIComponent(id)}/hqdefault.jpg`, tex=>{ if(!alive){ tex.dispose(); return; } tex.colorSpace=THREE.SRGBColorSpace; tex.anisotropy=maxAniso; onTex(tex); ask(); },
      undefined, ()=>console.info("[미술관] 썸네일을 텍스처로 못 받아 색 판으로 대체:", id)); }
    G.frames(room).forEach((v,i)=>{
      const [wi,ox]=SLOT_POS[i]; const portrait = v && v.kind==="short";
      const fw=portrait?1.12:1.8, fh=portrait?1.99:1.35, cy = portrait ? (dec==="birthday"&&i===0?1.55:1.72) : 1.68;
      const grp=new THREE.Group(); grp.position.set(ox,0,-W+0.03); pivots[wi].add(grp);
      const border=box(grp, fw+0.22,fh+0.22,0.06, woodMat, 0,cy,0.03);
      const mat=add(grp, new THREE.PlaneGeometry(fw+0.1,fh+0.1), matMat, 0,cy,0.062);
      const pic=add(grp, new THREE.PlaneGeometry(fw,fh), new THREE.MeshBasicMaterial({map: v ? titleTex(v,portrait) : emptyTex()}), 0,cy,0.064);
      if(dec!=="stage" && !(dec==="birthday"&&wi===0&&i===0)) add(grp, new THREE.PlaneGeometry(fw+1.4,1.6), glowMat, 0, Math.min(cy+fh/2+0.35, 3.0), 0.005);
      const lab=add(grp, new THREE.PlaneGeometry(1.5,0.28), new THREE.MeshBasicMaterial({map:labelTex(v?v.title:G.t("soon"))}), 0, cy-fh/2-0.32, 0.02);
      const act = v ? ()=>setTimeout(()=>G.openItem(v,{hall}),260) : ()=>G.toast(G.t("soon"));
      [border,pic,mat].forEach(m=>{ m.userData.act=act; clickables.push(m); });
      spots.push({p:onWall(wi,ox,cy,1.3), r:1.5, label:()=> v ? G.t("bWatch")+" · "+v.title : G.t("soon"), act});
      frames.push({pic,lab,v});
      if(v) ytTexture(v.id, tex=>{ if(portrait){ tex.repeat.set(0.42,1); tex.offset.set(0.29,0); } pic.material.map.dispose(); pic.material.map=tex; pic.material.needsUpdate=true; });
    });
    relabel.push(()=>frames.forEach(f=>{ if(!f.v){ f.pic.material.map.dispose(); f.pic.material.map=emptyTex(); f.lab.material.map.dispose(); f.lab.material.map=labelTex(G.t("soon")); } }));

    /* ---------- 방마다 꾸밈(도형만, 실존 인물·로고 없음) ---------- */
    if(dec==="stage"){        // 무대: 낮은 단 + 천장 트러스 + 색 조명 원뿔
      box(s, 10, 0.3, 1.6, lam(0x221c33), 0, 0.15, -W+0.8);
      box(s, 11, 0.12, 0.12, lam(0x8a8aa0), 0, H-0.35, -2.5);
      ["#ff6fb5","#6fd2ff","#ffd640","#b48cff"].forEach((c,i)=>{ const x=-3.6+i*2.4;
        box(s, 0.22,0.3,0.22, lam(0x333344), x, H-0.55, -2.5);
        add(s, new THREE.ConeGeometry(1.1, H-0.7, 16, 1, true), new THREE.MeshBasicMaterial({color:c, transparent:true, opacity:.13, depthWrite:false, side:THREE.DoubleSide}), x, (H-0.7)/2, -3.3).rotation.x=-0.25; });
    } else if(dec==="cozy"){  // 안원잘부: 둥근 러그 + 소파 + 스탠드 + 화분
      add(s, new THREE.CircleGeometry(1.8,28), lam(new THREE.Color(mix(color,"#fff4e4",.5))), 0, 0.01, -3.2).rotation.x=-Math.PI/2;
      const sofa=lam(new THREE.Color(color)); box(s, 2.4,0.45,0.9, sofa, 0,0.32,-4.9); box(s, 2.4,0.7,0.25, sofa, 0,0.75,-5.3); box(s, 0.25,0.6,0.9, sofa, -1.25,0.45,-4.9); box(s, 0.25,0.6,0.9, sofa, 1.25,0.45,-4.9);
      box(s, 0.05,1.5,0.05, lam(0x6a5a4a), 2.3,0.75,-5.0); add(s, new THREE.ConeGeometry(0.28,0.3,12,1,true), bas(0xfff1c9), 2.3,1.55,-5.0);
      add(s, new THREE.CylinderGeometry(0.22,0.18,0.4,10), lam(0xd9a273), -2.4,0.2,-5.0); add(s, new THREE.IcosahedronGeometry(0.42,0), lam(0x7fb36c), -2.4,0.75,-5.0);
      boxes.push([-1.5,1.5,-5.6,-4.4]);
    } else if(dec==="studio"){ // TV 예능: 밝은 스튜디오 — 색 띠 세트, 조명 스탠드, ON AIR
      ["#ff8fa3","#ffd166","#7fd1ff","#a3e4a0"].forEach((c,i)=>box(pivots[2], 2.2,0.35,0.03, lam(new THREE.Color(c)), (i<2?-1:1)*3.3, 0.6+(i%2)*0.45, -W+0.04));
      for(const [x,z] of [[-4.6,-4.4],[4.6,-4.4],[-4.6,4.2],[4.6,4.2]]){ add(s, new THREE.CylinderGeometry(0.03,0.03,2.2,6), lam(0x555b66), x,1.1,z);
        box(s, 0.5,0.4,0.3, lam(0x2d3340), x,2.3,z).lookAt(0,1.6,0); blockers.push({c:[x,z,0.35]}); }
      textPlane(pivots[1], 1.2, 0.36, 256, (g,w,h)=>{ g.fillStyle="#e23b3b"; g.fillRect(0,0,w,h); g.fillStyle="#fff"; g.font=`800 40px ${FONT}`; g.textAlign="center"; g.textBaseline="middle"; g.fillText("ON AIR",w/2,h/2+2); }).position.set(0,3.1,-W+0.05);

    function buildBirthday(){

        balloons.push({x:cx+dx,y,z:cz+dz,sy:1.18,c:party[(i+ci)%party.length]}); strings.push(new THREE.Vector3(cx+dx,y-0.26,cz+dz), new THREE.Vector3(cx,0.15,cz)); }); });
      instanced(s, new THREE.SphereGeometry(0.24,12,9), lam(0xffffff), balloons);
      s.add(new THREE.LineSegments(new THREE.BufferGeometry().setFromPoints(strings), new THREE.LineBasicMaterial({color:0xc9bfae})));
      /* 가운데 받침대 위 케이크 모형 */
      const cz=-2.2, ph=0.7;
      add(s, new THREE.CylinderGeometry(0.42,0.48,ph,20), lam(0xfbf8f2), 0,ph/2,cz);
      add(s, new THREE.CylinderGeometry(0.4,0.4,0.03,20), lam(0xe9e2d6), 0,ph+0.015,cz);
      add(s, new THREE.CylinderGeometry(0.3,0.3,0.2,20), lam(new THREE.Color(color)), 0,ph+0.13,cz);

      add(s, new THREE.TorusGeometry(0.3,0.025,6,24), lam(new THREE.Color(accent)), 0,ph+0.23,cz).rotation.x=Math.PI/2;
      instanced(s, new THREE.CylinderGeometry(0.012,0.012,0.12,5), lam(new THREE.Color(accent)), [-0.08,0,0.08].map(x=>({x,y:ph+0.44,z:cz})));
      instanced(s, new THREE.SphereGeometry(0.022,6,5), bas(0xffc94d), [-0.08,0,0.08].map(x=>({x,y:ph+0.52,z:cz,sy:1.5})));
      blockers.push({c:[0,cz,0.6]});
      /* 컵홀더 굿즈 진열대(빈 자리) — 뒤 벽 왼쪽 */
      const gx=-3.2, gz=5.2;   // 컵홀더 굿즈(추천 상점 진열대 위)
      const cups=instanced(s, new THREE.CylinderGeometry(0.075,0.06,0.22,12), lam(0xffffff), [-0.4,0,0.4].map(dx=>({x:gx+dx,y:0.91,z:gz})));
      instanced(s, new THREE.CylinderGeometry(0.08,0.07,0.09,12,1,true), lam(new THREE.Color(color)), [-0.4,0,0.4].map(dx=>({x:gx+dx,y:0.9,z:gz})));

      /* 벽 폴라로이드 12장 (살짝 기울게, 마스킹테이프) */

      const photos=(room.photos||[]).slice(0,PSLOTS.length), handle=hall.official?.igHandle||"instagram";

          const px=20, py=24, pw=120, ph2=120;
          if(it?.type==="instagram"){ const gr=g.createLinearGradient(px,py,px+pw,py+ph2); gr.addColorStop(0,"#ff8fc4"); gr.addColorStop(.6,"#b48cff"); gr.addColorStop(1,"#ffb36b"); g.fillStyle=gr; g.globalAlpha=igOk?1:.45; g.fillRect(px,py,pw,ph2); g.globalAlpha=1;
            g.fillStyle="#fff"; g.textAlign="center"; g.textBaseline="middle"; g.font=`600 13px ${FONT}`; g.fillText("@"+handle, px+pw/2, py+ph2/2-(it.date?10:0)); if(it.date){ g.font=`700 16px ${FONT}`; g.fillText(it.date, px+pw/2, py+ph2/2+14); } }
          else if(it?.type==="youtube"){ const gr=g.createLinearGradient(px,py,px+pw,py+ph2); gr.addColorStop(0,color); gr.addColorStop(1,"#ff465a"); g.fillStyle=gr; g.fillRect(px,py,pw,ph2); }

        const [wi,x,y,rz]=ps;

    /* ---------- 추천 상점 진열대(모든 방, 뒤 벽 왼쪽). 「광고」 표시 ---------- */
    { const gx=-3.2, gz=5.2, act=()=>G.openGoods(room);

      gs.position.set(gx,0.45,gz-0.28); gs.rotation.y=Math.PI; relabel.push(gs.userData.redraw);

    /* ---------- 미션: find(숨은 반짝이 물건) / quiz(퀴즈 받침대) ---------- */
    G.missions(hall.id, room.id).forEach(m=>{
      if(m.type==="find"){
        if(G.hasMission(m.id)) return;
        const [x,y,z]=m.pos||[0,0.06,0];
        const env=textPlane(s, 0.36, 0.24, 128, (g,w,h)=>{ g.fillStyle="#fffdf8"; g.fillRect(2,2,w-4,h-4); g.strokeStyle="#c9a45c"; g.lineWidth=3; g.strokeRect(2,2,w-4,h-4);
          g.beginPath(); g.moveTo(2,2); g.lineTo(w/2,h*0.6); g.lineTo(w-2,2); g.stroke(); g.fillStyle="#ff6f91"; g.beginPath(); g.arc(w/2,h*0.6,8,0,7); g.fill(); });

    const free=(x,z)=> Math.abs(x)<W-0.45 && Math.abs(z)<W-0.45 && !inCircles(x,z,blockers) && !boxes.some(b=>inBox(x,z,b));

  function goodsShape(parent, shape, col, x, y, z){

    if(shape==="album"){ box(g, 0.32,0.32,0.05, m, 0,0.17,0).rotation.x=-0.15; box(g, 0.22,0.04,0.052, wh, 0,0.12,0.001).rotation.x=-0.15; }
    else if(shape==="card"){ [-0.12,0,0.12].forEach((r,i)=>{ const c=box(g, 0.12,0.17,0.006, i===1?m:wh, i*0.03-0.03,0.1+i*0.005,i*0.01); c.rotation.z=r; }); }
    else if(shape==="stick"){ add(g, new THREE.CylinderGeometry(0.022,0.026,0.32,8), lam(0xffffff), 0,0.16,0); add(g, new THREE.SphereGeometry(0.075,12,8), new THREE.MeshBasicMaterial({color:new THREE.Color(col)}), 0,0.36,0); }
    else if(shape==="calendar"){ box(g, 0.34,0.25,0.02, wh, 0,0.15,0).rotation.x=-0.25; box(g, 0.3,0.06,0.022, m, 0,0.24,0.012).rotation.x=-0.25; }
    else if(shape==="tshirt"){ const sh=new THREE.Shape(); sh.moveTo(-0.1,0); sh.lineTo(0.1,0); sh.lineTo(0.1,0.18); sh.lineTo(0.17,0.14); sh.lineTo(0.21,0.21); sh.lineTo(0.08,0.28); sh.lineTo(0.03,0.25); sh.lineTo(-0.03,0.25); sh.lineTo(-0.08,0.28); sh.lineTo(-0.21,0.21); sh.lineTo(-0.17,0.14); sh.lineTo(-0.1,0.18); sh.lineTo(-0.1,0);
      add(g, new THREE.ExtrudeGeometry(sh,{depth:0.03,bevelEnabled:false}), m, 0,0.02,0); }
    else { add(g, new THREE.CylinderGeometry(0.055,0.06,0.2,10), m, 0,0.1,0); add(g, new THREE.CylinderGeometry(0.025,0.025,0.05,8), wh, 0,0.225,0); }
    return g;
  }
  function buildShop(gid){
    const grp=SHOP_GROUPS.find(x=>x.id===gid)||SHOP_GROUPS[0], color=grp.color||"#ff9ad5";
    const s=new THREE.Scene(); s.background=new THREE.Color(0xfbf7f2); hemi(s, 0xffffff, 0xf3e9da, 2.8);
    const W=7, H=4.2, clickables=[], relabel=[], spots=[];

    add(s, new THREE.PlaneGeometry(W*2,W*2), new THREE.MeshLambertMaterial({map:ft})).rotation.x=-Math.PI/2;
    add(s, new THREE.PlaneGeometry(W*2,W*2), bas(0xffffff), 0,H,0).rotation.x=Math.PI/2;
    const WALLS=[0,-Math.PI/2,Math.PI,Math.PI/2], wallM=lam(0xfffaf4), baseM=lam(new THREE.Color(mix("#e6d6bd",color,.4)));
    const pivots=WALLS.map(a=>{ const p=new THREE.Group(); p.rotation.y=a; s.add(p); add(p, new THREE.PlaneGeometry(W*2,H), wallM, 0,H/2,-W); box(p, W*2,0.14,0.04, baseM, 0,0.07,-W+0.02); return p; });
    const onWall=(wi,x,y,z)=>new THREE.Vector3(x,y,-W+z).applyAxisAngle(Y, WALLS[wi]);
    /* 앞 벽: 큰 간판 + 운영 안내 */
    const sign=textPlane(pivots[0], 4.6, 0.8, 640, (g,w,h)=>{ g.fillStyle=color; g.fillRect(0,0,w,h); g.fillStyle="#1e143c"; g.textAlign="center"; g.textBaseline="middle"; g.font=`800 50px ${FONT}`; g.fillText("🛍 "+G.t("shopOf",{g:G.nm(grp.name)}),w/2,h/2+2); });
    sign.position.set(0,2.9,-W+0.04); relabel.push(sign.userData.redraw);
    const fn=textPlane(pivots[0], 4.6, 0.22, 720, (g,w,h)=>{ g.fillStyle="#fffaf2"; g.fillRect(0,0,w,h); g.fillStyle="#6b6280"; g.font=`500 19px ${FONT}`; g.textAlign="center"; g.textBaseline="middle"; wrapText(g,G.t("freeNote"),w/2,h/2+1,w-20,22,1); });
    fn.position.set(0,2.36,-W+0.04); relabel.push(fn.userData.redraw);
    /* 양쪽 벽: 구역 6개 진열대(상품 최대 3개 + 끝에 「입점 자리」) */
    SHOP_CATEGORIES.forEach((cat,i)=>{
      const wi = i<3 ? 3 : 1, x=[-4.2,0,4.2][i%3], pv=pivots[wi], items=G.shopItems(gid, cat.id), zoneAct=()=>G.openZone(gid, cat);
      const shelf=box(pv, 3.0,0.9,0.6, lam(0xf1e4d2), x,0.45,-W+0.35);
      const zs=textPlane(pv, 3.0, 0.62, 448, (g,w,h)=>{ label(g,w,h,"#1e143c","#ffffff",G.nm(cat.name), items.length ? G.t("itemsN",{n:items.length}) : G.t("zoneSoon"), 38);
        g.fillStyle="#ffd640"; g.fillRect(8,8,84,24); g.fillStyle="#1e143c"; g.font=`800 15px ${FONT}`; g.textAlign="center"; g.textBaseline="middle"; g.fillText("광고 · AD",50,21); });
      zs.position.set(x,2.0,-W+0.04); relabel.push(zs.userData.redraw);
      [shelf,zs].forEach(m=>{ m.userData.act=zoneAct; clickables.push(m); });
      items.slice(0,3).forEach((it,k)=>{ const gx=x-1.05+k*0.7;
        const gm=goodsShape(pv, cat.shape, it.color||mix(color,["#ff7fb0","#7fb0ff","#ffd166"][k],.5), gx,0.9,-W+0.4);
        const tag=textPlane(pv, 0.6, 0.18, 192, (g,w,h)=>{ g.fillStyle="#fffdf8"; g.fillRect(0,0,w,h); g.strokeStyle="#e4d8c4"; g.strokeRect(1,1,w-2,h-2);
          g.fillStyle="#1e143c"; g.font=`700 18px ${FONT}`; g.textAlign="center"; g.textBaseline="middle"; wrapText(g,(it.seller?"["+(it.badge||G.t("sellerBadge"))+"] ":"")+(it.price||it.name),w/2,h/2+1,w-10,20,1); });

      const slot=box(pv, 0.5,0.4,0.4, new THREE.MeshBasicMaterial({color:0xffffff, transparent:true, opacity:0.5}), x+1.15,1.1,-W+0.4);
      const st=textPlane(pv, 0.62, 0.2, 192, (g,w,h)=>label(g,w,h,"#fff1f6","#c2416f",G.t("sellerBadge")+" +","",20)); st.position.set(x+1.15,0.62,-W+0.66); relabel.push(st.userData.redraw);
      [slot,st].forEach(m=>{ m.userData.act=()=>G.openSeller(); clickables.push(m); });
      spots.push({p:onWall(wi,x,1.0,1.4), r:1.7, label:()=>G.t("bProduct")+" · "+G.nm(cat.name), act:zoneAct});
    });
    /* 뒤 벽: 로비로 가는 문 + 입구 「입점 자리 · 판매자 모집」 */
    { const p=pivots[2], back=()=>G.go("lobby");
      box(p, 2.0,2.75,0.05, lam(0x9a7448), 0,1.37,-W+0.005);
      const door=add(p, new THREE.PlaneGeometry(1.8,2.6), new THREE.MeshBasicMaterial({map:doorGlow()}), 0,1.3,-W+0.04);
      const ds=textPlane(p, 1.6, 0.38, 320, (g,w,h)=>label(g,w,h,"#1e143c","#ffd640","← "+G.t("toLobby"),"",40)); ds.position.set(0,2.35,-W+0.06); relabel.push(ds.userData.redraw);
      [door,ds].forEach(m=>{ m.userData.act=back; clickables.push(m); });
      spots.push({p:onWall(2,0,1.9,1.0), r:1.3, label:()=>"← "+G.t("toLobby"), act:back});
      const sx=3.4, sellAct=()=>G.openSeller();
      const sb=box(p, 2.2,0.9,0.6, lam(0xfff1f6), sx,0.45,-W+0.35);
      const ss=textPlane(p, 2.6, 0.6, 448, (g,w,h)=>label(g,w,h,"#c2416f","#ffffff","🏪 "+G.t("sellerSlot"),G.t("sellerBtn"),34)); ss.position.set(sx,1.75,-W+0.04); relabel.push(ss.userData.redraw);
      [sb,ss].forEach(m=>{ m.userData.act=sellAct; clickables.push(m); });
      spots.push({p:onWall(2,sx,1.0,1.4), r:1.5, label:()=>G.t("bSeller"), act:sellAct}); }
    const free=(x,z)=> Math.abs(x)<W-1.05 && Math.abs(z)<W-0.5 && !(z>W-1.1 && x<-2.1 && x>-4.7);
    return {scene:s, clickables, relabel, spots, cam:{pos:[0,1.6,4.6], yaw:0, pitch:0.02, zoom:1.08},
      walk:{spawn:[0,W-1.8,0], free, camDist:3.0, camH:2.05, clampBox:W-0.2}};
  }

  /* ==========================================================
     장면 관리 — 지금 보는 곳만 만들고 그린다(나머지는 버림)
     ========================================================== */
  const cache={}; let cur=null, curKey="";
  const player={g:null, x:0, z:0, y:0, face:0};
  function sceneFor(view, hallId, roomId){
    if(view==="outside") return cache.outside ||= buildOutside();
    if(view==="lobby") return cache.lobby ||= buildLobby();
    if(view==="hub") return buildHub(G.hall(hallId));
    if(view==="shop") return buildShop(hallId);
    return buildRoom(G.hall(hallId), G.room(hallId, roomId));
  }
  function placePlayer(){
    if(player.g){ player.g.parent?.remove(player.g); player.g.traverse(o=>{ o.geometry?.dispose(); o.material?.dispose(); }); player.g=null; }
    if(!G.walk || !cur?.walk) return;
    player.g=petMesh(CHARS.find(c=>c.id===G.char)||CHARS[0], 1.45); cur.scene.add(player.g);
    const [x,z,yw]=cur.walk.spawn; player.x=x; player.z=z; player.face=yw; yaw=yw; pitch=0; syncPlayer();
  }
  function setScene(view, hallId, roomId){
    const key=[view,hallId,roomId].join("/"); if(key===curKey) return;
    if(cur){ if(player.g) cur.scene.remove(player.g); if(!(curKey.startsWith("outside")||curKey.startsWith("lobby"))){ cur.dispose?.(); disposeScene(cur.scene); } }
    cur=sceneFor(view,hallId,roomId); curKey=key;
    camera.position.set(...cur.cam.pos); yaw=cur.cam.yaw; pitch=cur.cam.pitch; zoom=cur.cam.zoom||1; vy=0; anim=null;
    placePlayer(); ask();
  }
  G.onWalkChange = () => { placePlayer(); if(!G.walk){ camera.position.set(...cur.cam.pos); yaw=cur.cam.yaw; pitch=cur.cam.pitch; } bubbleOff(); ask(); };
  G.onCharChange = () => { if(G.walk) { const {x,z,face}=player; placePlayer(); player.x=x; player.z=z; player.face=face; syncPlayer(); ask(); } };
  G.langHooks.push(()=>{ for(const c of [cache.outside, cache.lobby, cur]) c?.relabel?.forEach(f=>f()); ask(); });
  G.onProgress = () => { cache.lobby?.relabel?.forEach(f=>f()); ask(); };

  let busy=false;
  const sleep=ms=>new Promise(r=>setTimeout(r,ms));
  const fadeEl=document.getElementById("fade");
  async function fade(on){ fadeEl.classList.toggle("on",on); await sleep(380); }
  const tweens=[];
  function tween(ms, fn){ return new Promise(res=>{ const t0=performance.now(); tweens.push(now=>{ const t=Math.min(1,(now-t0)/ms); fn(t); if(t>=1){ res(); return false; } return true; }); ask(); }); }
  G.go3d = async (view, hallId, roomId) => {
    if(busy) return; busy=true; G.hideHint(); G.closeItem(); bubbleOff();
    try{
      if(G.view==="outside" && view==="lobby" && cur?.path && !G.walk){   // 들어가기: 앞길 → 계단 → 입구
        const curve=new THREE.CatmullRomCurve3(cur.path.map(p=>new THREE.Vector3(...p))), y0=yaw, p0=pitch; let fading=false;
        await tween(2600, t=>{ const e=t<.5?2*t*t:1-Math.pow(-2*t+2,2)/2; camera.position.copy(curve.getPoint(e));
          yaw=y0+((cur.endYaw||0)-y0)*Math.min(1,e*1.4); pitch=p0*(1-e); if(t>0.82 && !fading){ fading=true; fadeEl.classList.add("on"); } });
        await sleep(200);
      } else await fade(true);
      setScene(view, hallId, roomId); G.applyView(view, hallId, roomId); renderNow();
      await fade(false);
    } finally { busy=false; }
  };

  /* ---------- 걷기 모드: 조이스틱·키보드, 3인칭 카메라, 충돌, 다가가면 버튼 ---------- */
  const joy={x:0,y:0,id:null}, keys=new Set();
  const joyEl=document.getElementById("joy"), knob=document.getElementById("joyKnob"), bubble=document.getElementById("bubble");
  joyEl.addEventListener("pointerdown",e=>{ joy.id=e.pointerId; joyEl.setPointerCapture(e.pointerId); moveJoy(e); G.hideHint(); });
  joyEl.addEventListener("pointermove",e=>{ if(e.pointerId===joy.id) moveJoy(e); });
  const endJoy=e=>{ if(e.pointerId!==joy.id) return; joy.id=null; joy.x=joy.y=0; knob.style.transform=""; };
  joyEl.addEventListener("pointerup",endJoy); joyEl.addEventListener("pointercancel",endJoy);
  function moveJoy(e){ const r=joyEl.getBoundingClientRect(), R=r.width/2; let dx=e.clientX-r.left-R, dy=e.clientY-r.top-R; const d=Math.hypot(dx,dy), m=R*0.7;
    if(d>m){ dx*=m/d; dy*=m/d; } joy.x=dx/m; joy.y=dy/m; knob.style.transform=`translate(${dx}px,${dy}px)`; ask(); }
  addEventListener("keydown",e=>{ if(G.sheetOpen()) return; const k=e.key.toLowerCase(); if(["w","a","s","d","arrowup","arrowdown","arrowleft","arrowright"].includes(k)){ if(G.walk){ keys.add(k); e.preventDefault(); } }
    if(k==="e"||k==="enter"){ if(G.walk && nearSpot) nearSpot.act(); } });
  addEventListener("keyup",e=>keys.delete(e.key.toLowerCase()));
  function syncPlayer(){ if(!player.g) return; player.y=cur.walk.height ? cur.walk.height(player.x,player.z) : 0; player.g.position.set(player.x,player.y,player.z); player.g.rotation.y=player.face; }
  let nearSpot=null;
  function bubbleOff(){ nearSpot=null; bubble.classList.remove("on"); }
  bubble.onclick=()=>{ if(nearSpot){ const s=nearSpot; if(s.once) cur.spots.splice(cur.spots.indexOf(s),1); bubbleOff(); s.act(); } };
  let skyAcc=0, lastT=0, slowFrames=0, frameCount=0, suggested=false;
  function walkStep(dt){
    let fx=-joy.y, sx=joy.x;
    if(keys.has("w")||keys.has("arrowup")) fx+=1; if(keys.has("s")||keys.has("arrowdown")) fx-=1;
    if(keys.has("a")) sx-=1; if(keys.has("d")) sx+=1;
    if(keys.has("arrowleft")) yaw+=1.8*dt; if(keys.has("arrowright")) yaw-=1.8*dt;
    const mag=Math.min(1,Math.hypot(fx,sx)); let moving=false;
    if(mag>0.08){
      const sp=(cur===cache.outside?5.2:2.6)*dt*mag/Math.max(1,Math.hypot(fx,sx));
      const dx=(-Math.sin(yaw)*fx + Math.cos(yaw)*sx)*sp, dz=(-Math.cos(yaw)*fx - Math.sin(yaw)*sx)*sp, f=cur.walk.free;
      if(f(player.x+dx,player.z+dz)){ player.x+=dx; player.z+=dz; } else if(f(player.x+dx,player.z)) player.x+=dx; else if(f(player.x,player.z+dz)) player.z+=dz;
      player.face=Math.atan2(dx,dz)+Math.PI; moving=true;
    }
    syncPlayer();
    /* 3인칭 카메라: 캐릭터 뒤 */
    const w=cur.walk, d=w.camDist, base=player.y;
    let cx=player.x+Math.sin(yaw)*d, cz=player.z+Math.cos(yaw)*d;
    if(w.clampBox){ cx=Math.max(-w.clampBox,Math.min(w.clampBox,cx)); cz=Math.max(-w.clampBox,Math.min(w.clampBox,cz)); }
    if(w.clampR){ const r=Math.hypot(cx,cz); if(r>w.clampR){ cx*=w.clampR/r; cz*=w.clampR/r; } }
    camera.position.set(cx, base+w.camH, cz);
    /* 가장 가까운 상호작용 지점 */
    let best=null, bd=1e9; for(const s of cur.spots||[]){ const dd=Math.hypot(s.p.x-player.x, s.p.z-player.z); if(dd<s.r && dd<bd){ bd=dd; best=s; } }
    nearSpot=best; return moving;
  }
  function drawBubble(){
    if(!G.walk || !nearSpot || busy || G.sheetOpen()){ bubble.classList.remove("on"); return; }
    const v=nearSpot.p.clone(); v.y=Math.max(v.y, player.y+1.4); v.project(camera);
    const r=renderer.domElement.getBoundingClientRect();
    let x=(v.x+1)/2*r.width, y=(1-v.y)/2*r.height; if(v.z>1){ x=r.width/2; y=r.height*0.55; }
    x=Math.max(90,Math.min(r.width-90,x)); y=Math.max(150,Math.min(r.height-190,y));
    bubble.textContent="▶ "+nearSpot.label(); bubble.style.left=x+"px"; bubble.style.top=y+"px"; bubble.classList.add("on");
  }

  /* ---------- 둘러보기: 끌기·두 손가락·휠·화살표 (빠른 모드 + 걷기 모드 시점) ---------- */
  let yaw=0, pitch=0, vy=0, fovBase=70, zoom=1, anim=null, dirty=true;
  function ask(){ dirty=true; }
  const ptrs=new Map(); let down=null, pinch0=0, zoom0=1;
  const el=renderer.domElement;
  const k=()=>0.0055*camera.fov/70;
  const lim=()=> G.walk ? {pitchLim:[-0.35,0.35]} : (cur?.cam||{});
  function clampYaw(){ const l=lim().yawLim; if(l) yaw=Math.max(l[0],Math.min(l[1],yaw)); }
  el.addEventListener("pointerdown",e=>{ if(busy) return; el.setPointerCapture(e.pointerId); ptrs.set(e.pointerId,{x:e.clientX,y:e.clientY});
    anim=null; vy=0; if(ptrs.size===1) down={x:e.clientX,y:e.clientY,t:performance.now(),moved:0};
    if(ptrs.size===2){ const [a,b]=[...ptrs.values()]; pinch0=Math.hypot(a.x-b.x,a.y-b.y); zoom0=zoom; down=null; } G.hideHint(); });
  el.addEventListener("pointermove",e=>{ const p=ptrs.get(e.pointerId); if(!p) return;
    const dx=e.clientX-p.x, dy=e.clientY-p.y; p.x=e.clientX; p.y=e.clientY;
    if(ptrs.size===1){ const pl=lim().pitchLim||[-0.5,0.5]; yaw+=dx*k(); clampYaw(); pitch=Math.max(pl[0],Math.min(pl[1],pitch+dy*k())); vy=G.walk?0:dx*k(); if(down) down.moved+=Math.abs(dx)+Math.abs(dy); ask(); }
    else if(ptrs.size===2 && pinch0>0){ const [a,b]=[...ptrs.values()]; zoom=Math.max(0.6,Math.min(1.25,zoom0*pinch0/Math.hypot(a.x-b.x,a.y-b.y))); ask(); } });
  const up=e=>{ if(!ptrs.has(e.pointerId)) return; ptrs.delete(e.pointerId);
    if(down && ptrs.size===0 && down.moved<10 && performance.now()-down.t<600) tap(e.clientX,e.clientY);
    if(ptrs.size===0) down=null; };
  el.addEventListener("pointerup",up); el.addEventListener("pointercancel",e=>{ ptrs.delete(e.pointerId); down=null; });
  el.addEventListener("wheel",e=>{ e.preventDefault(); zoom=Math.max(0.6,Math.min(1.25,zoom*(1+e.deltaY*0.001))); ask(); },{passive:false});
  addEventListener("keydown",e=>{ if(G.sheetOpen()||busy||G.walk) return;
    if(e.key==="ArrowLeft") turnBy(Math.PI/4); if(e.key==="ArrowRight") turnBy(-Math.PI/4); });
  document.getElementById("turnL").onclick=()=>turnBy(Math.PI/4);
  document.getElementById("turnR").onclick=()=>turnBy(-Math.PI/4);
  function turnBy(d){ G.hideHint(); anim={from:yaw,to:yaw+d,p:0,pf:pitch,pt:0}; ask(); }
  function turnTo(target,pt=0){ const d=((target-yaw)%(Math.PI*2)+Math.PI*3)%(Math.PI*2)-Math.PI; anim={from:yaw,to:yaw+d,p:0,pf:pitch,pt}; ask(); }

  const ray=new THREE.Raycaster(), ndc=new THREE.Vector2(), tmp=new THREE.Vector3();
  function tap(x,y){
    if(busy||!cur) return;
    const r=el.getBoundingClientRect(); ndc.set(((x-r.left)/r.width)*2-1, -((y-r.top)/r.height)*2+1);
    ray.setFromCamera(ndc,camera); const hit=ray.intersectObjects(cur.clickables,false)[0]; if(!hit) return;
    if(G.view==="room" && !G.walk){ hit.object.getWorldPosition(tmp); const dx=tmp.x-camera.position.x, dz=tmp.z-camera.position.z;
      turnTo(Math.atan2(-dx,-dz), Math.max(-0.4,Math.min(0.4,Math.atan2(tmp.y-1.6, Math.hypot(dx,dz))))); }
    hit.object.userData.act?.();
  }

  function resize(){ const w=innerWidth,h=innerHeight; renderer.setSize(w,h,false); camera.aspect=w/h; fovBase = w<h ? 78 : 62; ask(); }
  addEventListener("resize",resize); resize();

  /* ---------- 그릴 일이 있을 때만 그림(배터리 절약). 걷는 중엔 계속 그림 ---------- */
  const ease=t=>1-Math.pow(1-t,3);
  function renderNow(){ const pr = G.walk && cur?.walk ? pitch-0.17 : pitch; camera.rotation.set(pr,yaw,0); camera.updateProjectionMatrix(); renderer.render(cur.scene,camera); dirty=false; }
  function loop(now){
    requestAnimationFrame(loop);
    const dt=Math.min(0.05, lastT ? (now-lastT)/1000 : 0.016); lastT=now;
    for(let i=tweens.length-1;i>=0;i--){ if(!tweens[i](now)) tweens.splice(i,1); dirty=true; }
    if(anim){ anim.p=Math.min(1,anim.p+0.06); const e=ease(anim.p); yaw=anim.from+(anim.to-anim.from)*e; pitch=anim.pf+(anim.pt-anim.pf)*e; if(anim.p>=1) anim=null; clampYaw(); dirty=true; }
    else if(ptrs.size===0 && Math.abs(vy)>0.0004){ yaw+=vy; vy*=0.9; clampYaw(); dirty=true; }
    const fov=fovBase*zoom; if(Math.abs(camera.fov-fov)>0.01){ camera.fov=fov; dirty=true; }
    if(document.hidden || !cur) return;
    let moving=false;
    /* 장면 움직임(하늘 비행선 등): 30fps로만, 패널이 열려 있으면 멈춤 */
    if(cur.animate && !G.sheetOpen()){ skyAcc+=dt; if(skyAcc>=1/30){ cur.animate(skyAcc); skyAcc=0; dirty=true; } }
    if(G.walk && cur.walk && player.g && !busy && !G.sheetOpen()){ if(walkStep(dt)) { moving=true; dirty=true; } else if(dirty) walkStep(0); if(animatePet(player.g, dt, moving)) dirty=true; }
    if(!dirty) return;
    renderNow(); drawBubble();
    /* 저사양 감지: 걷는 중 프레임이 계속 느리면 빠른 모드 제안(한 번만) */
    if(moving && !suggested){ frameCount++; if(dt>0.045) slowFrames++; if(frameCount>90){ if(slowFrames/frameCount>0.6){ suggested=true; G.suggestQuick(); } frameCount=slowFrames=0; } }
  }
  setScene(G.view, G.hallId, G.roomId);
  G.mode="3d"; G.three=THREE.REVISION;
  G._debug = { player, get yaw(){return yaw;}, set yaw(v){yaw=v; ask();}, get pitch(){return pitch;}, set pitch(v){pitch=v; ask();}, joy, ask, cur:()=>cur, boards };
  requestAnimationFrame(t=>{ loop(t); document.getElementById("loading").classList.add("off"); });
  el.addEventListener("webglcontextlost",e=>{ e.preventDefault(); G.mode="lost"; G.showFallback("WebGL 연결이 끊김"); });
}
</script>
</body>
</html>
