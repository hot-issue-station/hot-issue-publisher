<!doctype html>
<!-- 운영자용 갤러리 통계판(대표 11/12 13:24 "통계를 내가 확인할 수 있도록 덕심 앱 안에 아이콘으로"). 링크 공개 안 함, 검색 제외. -->
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="theme-color" content="#1b1430">
<title>갤러리 통계 · 3D 덕심 갤러리</title>
<style>
:root{--bg:#1b1430;--card:#261d42;--line:#3a2f5e;--tx:#f3eeff;--mut:#b7abd6;--y:#ffd640;--p:#9b6bff}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;padding:16px 16px 40px}
h1{font-size:20px;margin:4px 0 2px}.sub{color:var(--mut);font-size:13px;margin-bottom:14px}
.kpis{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:12px}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 10px;text-align:center}
.kpi b{display:block;font-size:24px;color:var(--y)}.kpi span{font-size:12px;color:var(--mut)}
.btn{display:block;text-align:center;background:var(--p);color:#fff;text-decoration:none;font-weight:700;padding:13px;border-radius:12px;margin:10px 0}
.btn.ghost{background:transparent;border:1px solid var(--line);color:var(--tx)}
h2{font-size:15px;margin:18px 0 8px}
.row{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px}
.row .t{font-size:13px;line-height:1.35;overflow:hidden;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical}
.row .t small{display:block;color:var(--mut);font-size:11px;margin-top:2px}
.row .n{font-size:13px;color:var(--y);font-weight:700;white-space:nowrap}
.bar{height:6px;border-radius:3px;background:var(--p);margin-top:5px}
.note{color:var(--mut);font-size:12px;line-height:1.5}
.err{background:#3d1d2a;border:1px solid #7a3550;border-radius:12px;padding:12px;font-size:13px}
</style>
</head>
<body>
<h1>📊 3D 덕심 갤러리 통계</h1>
<div class="sub" id="when">불러오는 중…</div>

<div class="kpis">
  <div class="kpi"><b id="kView">–</b><span>영상 열람</span></div>
  <div class="kpi"><b id="kLike">–</b><span>추천 👍</span></div>
  <div class="kpi"><b id="kVid">–</b><span>본 영상 수</span></div>
</div>

<a class="btn" href="https://dash.cloudflare.com/1d2064bd65264be424fa7ef8f9d9a5cc/web-analytics" target="_blank" rel="noopener">👥 방문자 수·나라·기기 보기 (Cloudflare)</a>
<p class="note">방문자 숫자는 Cloudflare 로그인(reaymi.music 계정) 뒤에 보여요. 아래 숫자는 갤러리 안에서 영상을 열고 추천한 횟수예요(모든 방문자 합계).</p>

<h2>🔥 많이 본 영상</h2>
<div id="list"></div>
<h2>💜 방(테마)별 열람</h2>
<div id="themes"></div>
<a class="btn ghost" href="./">← 갤러리로</a>

<script>
const FS = "https://firestore.googleapis.com/v1/projects/duksim-gallery/databases/(default)/documents/stats?pageSize=300";
const num = f => f ? Number(f.integerValue ?? f.doubleValue ?? 0) : 0;
const el = (t, c, txt) => { const e = document.createElement(t); if (c) e.className = c; if (txt != null) e.textContent = txt; return e; };
async function load() {
  try {
    const [st, cur] = await Promise.all([
      fetch(FS, {cache: "no-store"}).then(r => { if (!r.ok) throw new Error("통계 " + r.status); return r.json(); }),
      fetch("curation.json", {cache: "no-store"}).then(r => r.ok ? r.json() : {themes: []}).catch(() => ({themes: []}))
    ]);
    const info = {}; const themeOf = {};
    (cur.themes || []).forEach(t => (t.videos || []).forEach(v => { info[v.video_id] = v; themeOf[v.video_id] = t.name; }));
    const rows = (st.documents || []).map(d => {
      const id = decodeURIComponent(d.name.split("/").pop());
      return {id, view: num(d.fields?.view), like: num(d.fields?.like)};
    }).sort((a, b) => (b.view + b.like * 2) - (a.view + a.like * 2));
    const tv = rows.reduce((s, r) => s + r.view, 0), tl = rows.reduce((s, r) => s + r.like, 0);
    kView.textContent = tv.toLocaleString(); kLike.textContent = tl.toLocaleString(); kVid.textContent = rows.length;
    when.textContent = "지금 숫자 · " + new Date().toLocaleString("ko-KR", {timeZone: "Asia/Seoul"});
    const max = Math.max(1, ...rows.map(r => r.view));
    list.textContent = "";
    if (!rows.length) list.appendChild(el("p", "note", "아직 기록이 없어요."));
    rows.slice(0, 30).forEach((r, i) => {
      const v = info[r.id] || {}; const row = el("div", "row");
      const t = el("div", "t"); t.appendChild(document.createTextNode((i + 1) + ". " + (v.title || r.id)));
      t.appendChild(el("small", null, (themeOf[r.id] || "기타") + (v.channel ? " · " + v.channel : "")));
      const b = el("div", "bar"); b.style.width = Math.max(4, Math.round(r.view / max * 100)) + "%"; t.appendChild(b);
      row.append(t, el("div", "n", "👁 " + r.view), el("div", "n", "👍 " + r.like)); list.appendChild(row);
    });
    const byT = {}; rows.forEach(r => { const k = themeOf[r.id] || "기타"; byT[k] = (byT[k] || 0) + r.view; });
    themes.textContent = "";
    Object.entries(byT).sort((a, b) => b[1] - a[1]).forEach(([k, n]) => {
      const row = el("div", "row"); const t = el("div", "t", k); const b = el("div", "bar"); b.style.width = Math.max(4, Math.round(n / Math.max(1, tv) * 100)) + "%"; t.appendChild(b);
      row.append(t, el("div", "n", "👁 " + n), el("div", "n", "")); themes.appendChild(row);
    });
  } catch (e) {
    when.textContent = ""; list.textContent = "";
    list.appendChild(el("div", "err", "숫자를 불러오지 못했어요(" + e.message + "). 잠시 뒤 새로고침해 주세요."));
  }
}
load();
</script>
</body>
</html>
