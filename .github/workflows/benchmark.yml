name: 벤치마킹 계정 모니터링
on:
  # 일정 꺼 둠(10/28): 지금 토큰(Instagram 로그인 방식)은 다른 계정 읽기(business_discovery)를 지원하지 않음.
  # Facebook 로그인 방식 토큰으로 바꾸면 다시 켠다.
  workflow_dispatch:
permissions:
  contents: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - name: 벤치마킹 계정 읽기
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
        run: python scripts/watch_benchmark.py || true
      - run: |
          git config user.name "issuebrief-bot"; git config user.email "bot@users.noreply.github.com"
          git add data/benchmark
          git diff --cached --quiet || (git commit -m "벤치마킹 모니터링 $(date -u +%F)" && git pull --rebase && git push)
