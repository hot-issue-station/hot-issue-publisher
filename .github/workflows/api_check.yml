name: API 키 점검 (Claude·Gemini)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 키 점검 (값은 출력하지 않음)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        shell: python
        run: |
          import os, json, urllib.request, urllib.error
          def post(url, headers, body):
              req = urllib.request.Request(url, data=json.dumps(body).encode(), headers=headers, method="POST")
              try:
                  with urllib.request.urlopen(req, timeout=60) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return e.code, {}
              except Exception as e:
                  return 0, {}
          def get(url, headers):
              try:
                  with urllib.request.urlopen(urllib.request.Request(url, headers=headers), timeout=60) as r:
                      return r.status, json.loads(r.read())
              except urllib.error.HTTPError as e:
                  return e.code, {}
              except Exception:
                  return 0, {}
          ak = os.environ.get("ANTHROPIC_API_KEY", "")
          gk = os.environ.get("GEMINI_API_KEY", "")
          print("ANTHROPIC_API_KEY:", "있음" if ak else "없음")
          print("GEMINI_API_KEY:", "있음" if gk else "없음")
          if ak:
              st, js = post("https://api.anthropic.com/v1/messages",
                  {"x-api-key": ak, "anthropic-version": "2023-06-01", "content-type": "application/json"},
                  {"model": "claude-haiku-5-5", "max_tokens": 30,
                   "messages": [{"role": "user", "content": "일본어 한 문장으로만 번역: 리센느가 이틀 연속 1위를 했어요."}]})
              txt = "".join(c.get("text", "") for c in js.get("content", [])) if st == 200 else ""
              print("Claude Haiku:", "성공" if st == 200 else f"실패 (HTTP {st})", "|", txt[:80])
          if gk:
              st, js = get("https://generativelanguage.googleapis.com/v1beta/models", {"x-goog-api-key": gk})
              names = [m["name"] for m in js.get("models", []) if "generateContent" in m.get("supportedGenerationMethods", [])]
              flash = [n for n in names if "flash" in n and "lite" not in n and "image" not in n and "tts" not in n]
              print("Gemini 모델 목록:", "성공" if st == 200 else f"실패 (HTTP {st})", "| flash 후보:", ", ".join(flash[:5]))
              pref=[n for n in ["models/gemini-flash-latest","models/gemini-3.5-flash"] if n in names]
              flash = pref + flash
              for mdl in list(dict.fromkeys(flash))[:4]:
                  st2, js2 = post(f"https://generativelanguage.googleapis.com/v1beta/{mdl}:generateContent",
                      {"x-goog-api-key": gk, "content-type": "application/json"},
                      {"contents": [{"parts": [{"text": "일본어 한 문장으로만 번역: 리센느가 이틀 연속 1위를 했어요."}]}]})
                  t2 = ""
                  try: t2 = js2["candidates"][0]["content"]["parts"][0]["text"]
                  except Exception: pass
                  print("Gemini 번역:", mdl, "성공" if st2 == 200 else f"실패 (HTTP {st2})", "|", t2.strip()[:80])
                  if st2 == 200: break
