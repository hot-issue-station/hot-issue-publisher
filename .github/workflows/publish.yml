name: 예약 게시

on:
  schedule:
    # GitHub 예약 시각은 UTC 기준. 한국 시간 = UTC + 9시간. 하루 4회: 출근 07:30 · 점심 12:00 · 퇴근 18:30 · 리센느 데일리 20:00(~12/31)
    - cron: "30 22 * * *"  # 한국 07:30 출근 (AM)
    - cron: "0 3 * * *"    # 한국 12:00 점심 (PM)
    - cron: "30 9 * * *"   # 한국 18:30 퇴근 (NT)
    # GitHub 예약은 5~15분 늦거나 빠질 수 있어 20분 뒤·90분 뒤 한 번 더 돈다 (이미 올라간 묶음은 건너뜀)
    - cron: "50 22 * * *"  # 07:50
    - cron: "20 3 * * *"   # 12:20
    - cron: "50 9 * * *"   # 18:50
    - cron: "0 0 * * *"    # 09:00
    - cron: "30 4 * * *"   # 13:30
    - cron: "0 11 * * *"   # 20:00 리센느 데일리(RS) 겸 퇴근 재시도
    - cron: "20 11 * * *"  # 20:20 (RS 재시도)
    - cron: "30 12 * * *"  # 21:30 (RS 재시도)
  workflow_dispatch:
    inputs:
      preflight:
        description: "미리 점검만 하기 (게시 안 함)"
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: 예약 시각이 된 묶음 게시
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          DRY_RUN: ${{ vars.DRY_RUN || 'true' }}
          PREFLIGHT: ${{ inputs.preflight || 'false' }}
        run: python scripts/publish.py
      - name: 게시 기록 저장
        if: always()
        run: |
          git config user.name "issuebrief-bot"
          git config user.email "issuebrief-bot@users.noreply.github.com"
          mkdir -p posts && git add -A posts
          git diff --cached --quiet || git commit -m "게시 기록"
          for i in 1 2 3 4 5; do git pull --rebase -q origin main && git push && break; sleep 5; done
