
<title>릴스 재료함</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap">
<style>
/* Layout: one narrow column of round cards, newest first — video on top, two big thumb buttons under it. */
:root{
  --bg:#F2F4F8; --surface:#FFFFFF; --ink:#101827; --muted:#5B6578; --line:#D8DEE8;
  --accent:#0A7FA3; --accent-ink:#FFFFFF; --done:#1F7A4A; --pink:#C81E6E; --danger:#C0392B;
  --f:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1220; --surface:#141D30; --ink:#F2F5FB; --muted:#A3AFC6; --line:#2A3A59;
  --accent:#35E0FF; --accent-ink:#0B1220; --done:#5DD39E; --pink:#FF4FA3; --danger:#FF6B5E; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1220; --surface:#141D30; --ink:#F2F5FB; --muted:#A3AFC6; --line:#2A3A59;
  --accent:#35E0FF; --accent-ink:#0B1220; --done:#5DD39E; --pink:#FF4FA3; --danger:#FF6B5E; color-scheme:dark}
body{background:var(--bg);color:var(--ink);font-family:var(--f);font-size:15px;line-height:1.55}
.wrap{max-width:560px;margin:0 auto;padding-block:18px 56px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
h1{margin:0;font-size:22px;font-weight:900;text-wrap:balance}
.sub{color:var(--muted);font-size:13px;margin:4px 0 0}
.item{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.item.posted{opacity:.6}
.plat{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.plat button{min-height:44px;font-size:13px;padding:0 4px}
.plat button.ok{background:var(--done);border-color:var(--done);color:#fff}
.item.removing{opacity:.4;pointer-events:none}
.meta{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px;color:var(--muted)}
.slot{font-weight:700;color:var(--pink)}
.topic{font-weight:700;font-size:16px;text-wrap:balance}
video{width:100%;max-width:100%;aspect-ratio:9/16;max-height:62vh;background:#000;border-radius:12px;display:block}
.row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
button{font:inherit;font-weight:700;border-radius:12px;min-height:46px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.del{color:var(--danger);border-color:var(--line);background:transparent}
button.del.armed{background:var(--danger);border-color:var(--danger);color:#fff}
button:focus-visible{outline:3px solid var(--pink);outline-offset:2px}
button:disabled{opacity:.5}
details summary{cursor:pointer;font-size:13px;color:var(--muted)}
pre{white-space:pre-wrap;font:inherit;font-size:13px;background:var(--bg);border-radius:10px;padding:10px;margin:8px 0 0;min-width:0}
.cards{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;margin-top:8px}
.cards img{width:100%;max-width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:6px;border:1px solid var(--line)}
.msg{font-size:12px;color:var(--muted);min-height:1em}
.empty{text-align:center;color:var(--muted);padding:40px 12px;border:1px dashed var(--line);border-radius:16px}
.chip{font-size:12px;font-weight:700;color:var(--done)}
.ig{display:flex;align-items:center;justify-content:center;min-height:46px;border-radius:12px;background:var(--pink);color:#fff;font-weight:700;text-decoration:none}
.ig:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.promo{border:1px solid var(--line);border-radius:12px;padding:10px 12px;display:flex;flex-direction:column;gap:10px}
.promo summary{font-weight:700;color:var(--ink);font-size:14px}
.pch{display:flex;flex-direction:column;gap:6px;padding-top:8px;border-top:1px dashed var(--line)}
.pch h3{margin:0;font-size:13px;font-weight:700;color:var(--pink)}
.pch pre{margin:0}
.pch button{min-height:40px}
.best{font-size:13px;color:var(--done);font-weight:700}
.nums{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px}
.nums button{min-height:44px;padding:0;font-size:15px}
.nums button.ok{background:var(--done);border-color:var(--done);color:#fff}
.numlab{font-size:12px;color:var(--muted)}
.hooks{display:flex;flex-direction:column;gap:6px}
.hooks button{min-height:42px;text-align:left;padding:8px 12px;font-weight:700}
.hooks button.ok{border-color:var(--done);color:var(--done)}
#plan{background:var(--surface);border:2px solid var(--accent);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
#plan h2{margin:0;font-size:17px}
#plan table{width:100%;border-collapse:collapse;font-size:13px}
#plan td,#plan th{border-top:1px solid var(--line);padding:6px 4px;text-align:left;vertical-align:top}
#plan th{color:var(--muted);font-weight:700;white-space:nowrap}
.tablewrap{overflow-x:auto}
#picks{display:flex;flex-direction:column;gap:12px}
#snips{background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:8px}
#snips h2{margin:0;font-size:16px}
#snips .snip{display:flex;gap:8px;align-items:flex-start;border-top:1px solid var(--line);padding-top:8px}
#snips .snip p{margin:0;flex:1;min-width:0;font-size:14px;line-height:1.5;overflow-wrap:anywhere}
#snips .snip button{flex:none;min-height:40px;padding:0 12px;border-radius:10px;border:1px solid var(--accent);background:transparent;color:var(--fg);font-weight:700;cursor:pointer}
#snips .snip button.ok{background:var(--accent);color:#fff}
#picks > button.primary{min-height:50px}
.pick button.armed{background:var(--pink);border-color:var(--pink);color:#fff}
.pick{background:var(--surface);border:2px solid var(--pink);border-radius:16px;padding:14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.pick h2{margin:0;font-size:17px}
.cand{display:flex;flex-direction:column;gap:4px;text-align:left;padding:10px 12px;min-height:56px}
.cand .t{font-weight:700;font-size:15px}
.cand .s{font-weight:400;font-size:13px;color:var(--muted)}
.cand.ok{background:var(--done);border-color:var(--done);color:#fff}
.cand.armed{border:2px solid var(--pink);background:var(--bg)}
.cand.ok .s{color:#fff}
.pick input{font:inherit;min-height:46px;border-radius:12px;border:1px solid var(--line);background:var(--bg);color:var(--ink);padding:0 12px;min-width:0;width:100%;box-sizing:border-box}
.pick .row2{display:grid;grid-template-columns:1fr auto;gap:8px}
.pick .done{font-weight:700;color:var(--done)}

</style>

<div class="wrap">
  <header>
    <h1>릴스 재료함</h1>
    <p class="sub">회차마다 Claude가 만든 카드, 음악 없는 영상, 릴스 소개글·해시태그가 여기 쌓여요. 필요한 것만 저장해서 인스타그램 앱에서 릴스로 올려 주세요. 필요 없는 재료는 맨 아래 [삭제]를 두 번 눌러 지울 수 있어요.</p>
    <a class="ig" style="background:var(--accent);color:var(--accent-ink);margin-top:10px" href="https://claude.ai/artifact/DYNjdk9yZ78mJae6VNM4Xf" target="_blank" rel="noopener">소재 고르기·만들 방법은 「영상 제작기」에서 한 번에 →</a>
  </header>
  <section id="snips" hidden></section>
  <section id="picks" hidden></section>
  <section id="plan" hidden></section>
  <div id="list"><div class="empty">아직 재료가 없어요.<br>다음 회차(출근 06:35 제작)부터 여기에 영상이 올라와요.</div></div>
</div>

<script>
(async () => {
  const $ = s => document.querySelector(s);
  const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
  const db = await claude.use("db");
  const downloads = await claude.use("downloads");
  const assets = await claude.use("assets");   // 편집 권한이 있는 사람(대표)에게만 열림 → 영상·카드 파일까지 지움
  if (!db) { $("#list").innerHTML = `<div class="empty">이 화면에서는 재료함을 열 수 없어요. Claude 앱이나 claude.ai에서 열어 주세요.</div>`; return; }
  let items = [];
  const armed = new Map();   // 삭제 버튼 첫 번째 누름 → 4초 안에 한 번 더 누르면 삭제
  const blob = id => "/_blob/" + id;
  // 한 장씩 저장: 저장한 번호는 초록색(이 휴대폰에만 기억)
  const SK = "reels_saved_v1";
  let savedOne = {};
  try { savedOne = JSON.parse(localStorage.getItem(SK) || "{}") || {}; } catch { savedOne = {}; }
  const markSaved = k => { savedOne[k] = 1; try { localStorage.setItem(SK, JSON.stringify(savedOne)); } catch {} };
  function numsHtml(m, key, label){
    const list = m[key] || []; if (!list.length) return "";
    return `<div class="numlab">${esc(label)}</div><div class="nums">${list.map((c, i) => `<button type="button" data-act="one" data-key="${key}" data-i="${i}" class="${savedOne[`${m.id}:${key}:${i}`] ? "ok" : ""}" aria-label="${i+1}번 카드 저장">${i+1}</button>`).join("")}</div>`;
  }
  // 휴대폰 공유 창(여러 장 한 번에 → 갤러리 저장·인스타)을 쓸 수 있는 화면인지
  let canShareFiles = false;
  try { canShareFiles = !!(navigator.canShare && navigator.canShare({ files: [new File([new Uint8Array([255,216,255])], "t.jpg", { type: "image/jpeg" })] })); } catch { canShareFiles = false; }
  // 압축 없는(STORE) zip 만들기 — 외부 라이브러리 없이
  const CRC = (() => { const t = new Uint32Array(256); for (let n = 0; n < 256; n++) { let c = n; for (let k = 0; k < 8; k++) c = c & 1 ? 0xEDB88320 ^ (c >>> 1) : c >>> 1; t[n] = c >>> 0; } return t; })();
  const crc32 = u => { let c = 0xFFFFFFFF; for (let i = 0; i < u.length; i++) c = CRC[(c ^ u[i]) & 255] ^ (c >>> 8); return (c ^ 0xFFFFFFFF) >>> 0; };
  function makeZip(files){
    const enc = new TextEncoder(); const parts = []; const central = []; let off = 0;
    for (const f of files) {
      const nm = enc.encode(f.name), d = f.data, crc = crc32(d);
      const h = new DataView(new ArrayBuffer(30));
      h.setUint32(0, 0x04034b50, true); h.setUint16(4, 20, true); h.setUint16(6, 0x0800, true); h.setUint16(8, 0, true);
      h.setUint32(14, crc, true); h.setUint32(18, d.length, true); h.setUint32(22, d.length, true); h.setUint16(26, nm.length, true);
      parts.push(new Uint8Array(h.buffer), nm, d);
      const c = new DataView(new ArrayBuffer(46));
      c.setUint32(0, 0x02014b50, true); c.setUint16(4, 20, true); c.setUint16(6, 20, true); c.setUint16(8, 0x0800, true);
      c.setUint32(16, crc, true); c.setUint32(20, d.length, true); c.setUint32(24, d.length, true); c.setUint16(28, nm.length, true); c.setUint32(42, off, true);
      central.push(new Uint8Array(c.buffer), nm);
      off += 30 + nm.length + d.length;
    }
    const csize = central.reduce((s, p) => s + p.length, 0);
    const e = new DataView(new ArrayBuffer(22));
    e.setUint32(0, 0x06054b50, true); e.setUint16(8, files.length, true); e.setUint16(10, files.length, true); e.setUint32(12, csize, true); e.setUint32(16, off, true);
    return new Blob([...parts, ...central, new Uint8Array(e.buffer)], { type: "application/zip" });
  }
  // 채널별 홍보 재료(분석팀): promo = {bestTime, story:{text,sticker}, threads, shorts:{title,description,tags}, x, community}
  const PCH = [
    ["story", "인스타 스토리", p => p.story ? `${p.story.text || ""}${p.story.sticker ? `\n\n[질문 스티커] ${p.story.sticker}` : ""}` : ""],
    ["threads", "Threads 본문 (앱에서 음악 스티커 붙여 직접 올리기)", p => p.threads || ""],
    ["thr1", "Threads 내 글에 답글 ①", p => (p.threadsReplies || [])[0] || ""],
    ["thr2", "Threads 내 글에 답글 ②", p => (p.threadsReplies || [])[1] || ""],
    ["shorts", "유튜브 쇼츠", p => p.shorts ? `[제목]\n${p.shorts.title || ""}\n\n[설명]\n${p.shorts.description || ""}\n\n[태그]\n${p.shorts.tags || ""}` : ""],
    ["x", "X(트위터)", p => p.x || ""],
    ["tiktok", "틱톡", p => p.tiktok || ""],
    ["community", "팬 커뮤니티", p => p.community || ""],
  ];
  function promoHtml(m){
    const p = m.promo; if (!p) return "";
    const chans = PCH.map(([k, name, fn]) => [k, name, fn(p)]).filter(c => c[2]);
    if (!chans.length) return "";
    return `<details class="promo"><summary>📣 홍보 재료 · 채널 ${chans.length}곳</summary>
      ${p.bestTime ? `<div class="best">⏰ 추천 시각: ${esc(p.bestTime)}</div>` : ""}
      ${chans.map(([k, name, t]) => `<div class="pch"><h3>${esc(name)}</h3><pre>${esc(t)}</pre><button data-act="promo" data-key="${k}" type="button">${esc(name)} 글 복사</button></div>`).join("")}
    </details>`;
  }
  // 플랫폼별 올림 표시(대표 결정 10/31, X 추가 11/1): postedTo = {ig, shorts, threads, x}. 예전 posted(인스타)도 인스타로 읽는다.
  const PLAT = [["ig", "인스타"], ["shorts", "쇼츠"], ["threads", "Threads"], ["x", "X"], ["tiktok", "틱톡"]];   // 틱톡 추가(대표 요청 11/3)
  const isOn = (m, k) => !!((m.postedTo || {})[k] || (k === "ig" && m.posted && !(m.postedTo && "ig" in m.postedTo)));
  const platCount = m => PLAT.filter(([k]) => isOn(m, k)).length;
  function render(){
    if (!items.length) { $("#list").innerHTML = `<div class="empty">재료함이 비어 있어요.<br>다음 회차가 만들어지면 여기에 올라와요.</div>`; return; }
    $("#list").innerHTML = items.map(m => `
      <article class="item ${platCount(m) === PLAT.length ? "posted" : ""}" data-id="${esc(m.id)}">
        <div class="meta"><span><span class="slot">${esc(m.slotName || m.slot)}</span> · ${esc(m.date || "")}</span>${platCount(m) ? `<span class="chip">올림 ${platCount(m)}/${PLAT.length}</span>` : ""}</div>
        <div class="topic">${esc(m.topic || "")}</div>
        ${m.audio ? `<div class="msg">♪ 추천 음원: ${esc(m.audio)}</div>` : ""}
        ${m.reel ? `<video controls playsinline preload="metadata" src="${esc(blob(m.reel))}"></video>` : ""}
        <div class="row">
          <button class="primary" data-act="save" type="button" ${m.reel && downloads ? "" : "disabled"}>영상 저장</button>
          <button data-act="copy" type="button">소개글 복사</button>
        </div>
        ${(m.cards || []).length ? `<div class="row"><button data-act="cards" data-key="cards" type="button">릴스용 카드 ${m.cards.length}장 저장</button>${canShareFiles ? `<button data-act="share" data-key="cards" type="button">${m.cards.length}장 한 번에 공유·저장</button>` : `<button data-act="zip" data-key="cards" type="button">(PC용) ${m.cards.length}장 압축 저장</button>`}</div>` : ""}
        ${numsHtml(m, "cards", "릴스용 카드 한 장씩 저장 (누른 장은 초록색)")}
        ${(m.readCards || []).length ? `<div class="row"><button data-act="cards" data-key="readCards" type="button">읽는 카드 ${m.readCards.length}장 저장</button><button data-act="copyRead" type="button">캐러셀 캐션 복사</button></div>` : ""}
        ${!(m.readCards || []).length && m.readCaption ? `<button data-act="copyRead" type="button">캐러셀 캡션 복사</button>` : ""}
        ${numsHtml(m, "readCards", "읽는 카드 한 장씩 저장")}
        <a class="ig" href="https://www.instagram.com/" target="_blank" rel="noopener">인스타 열기 → + → 릴스</a>
        <div class="numlab">어디에 올렸나요? (누르면 초록색, 다시 누르면 지워져요)</div>
        <div class="plat">${PLAT.map(([k, name]) => `<button type="button" data-act="plat" data-key="${k}" class="${isOn(m, k) ? "ok" : ""}" aria-pressed="${isOn(m, k)}">${isOn(m, k) ? "✓ " : ""}${name}</button>`).join("")}</div>
        <div class="msg" aria-live="polite"></div>
        <details><summary>릴스 소개글·해시태그 보기</summary><pre>${esc(m.caption || "")}</pre></details>
        ${(m.cards || []).length ? `<details><summary>릴스용 카드 ${m.cards.length}장 보기</summary><div class="cards">${m.cards.map((c,i) => `<img src="${esc(blob(c))}" alt="카드 ${i+1}" loading="lazy">`).join("")}</div></details>` : ""}
        ${(m.readCards || []).length ? `<details><summary>읽는 카드 ${m.readCards.length}장 보기</summary><div class="cards">${m.readCards.map((c,i) => `<img src="${esc(blob(c))}" alt="읽는 카드 ${i+1}" loading="lazy">`).join("")}</div></details>` : ""}
        ${(m.hooks || []).length ? `<div class="numlab">훅(첫 화면·첫 줄) 후보 — 눌러서 복사</div><div class="hooks">${m.hooks.map((h, i) => `<button type="button" data-act="hook" data-i="${i}">${["①","②","③"][i] || "·"} ${esc(h)}</button>`).join("")}</div>` : ""}
        ${promoHtml(m)}
        <button class="del" data-act="delete" type="button">삭제</button>
      </article>`).join("");
  }

  // 소재 고르기(대표 결정 10/31): 자동 회차는 후보만 올리고, 대표가 고른 소재만 만든다.
  // picks/<YYYYMMDD>_<SLOT> = {date, slot, slotName, makeAt, status:"waiting"|"picked"|"skipped"|"made", candidates:[{title, summary, why, sources}], picked, custom, createdAt}
  // 버튼을 누르면 "고른 소재 만들기" 작업을 바로 깨운다(대표 결정 10/31: 실시간 이슈를 보고 고르기)
  const MAKER = "trig_01HJ9Y72Uf1MRw78fkG7czNb";
  const mcp = await claude.use("mcp");
  async function wake(why){
    if (!mcp) return "slow";
    try { await mcp.callTool("Claude Code Remote", "fire_trigger", { trigger_id: MAKER, text: "재료함 버튼으로 바로 실행: " + why }); return "ok"; }
    catch (e) { return (e && e.code === "approval_required") ? "approval" : "slow"; }
  }
  const wakeMsg = (r, okText) => r === "ok" ? okText : r === "approval" ? "바로 실행하려면 허용이 필요해요. 다시 눌러 허용해 주세요 (안 하면 매시 정각 전 확인 때 처리돼요)" : "요청은 남겼어요. 바로 깨우지 못해 다음 정시 확인 때 처리돼요";
  let picks = [];
  function renderPicks(){
    const el = $("#picks");
    const show = picks.filter(p => ["waiting", "picked", "refresh", "making", "cards_ready", "confirmed", "redo"].includes(p.status)).slice(0, 4);
    el.hidden = false;
    const nowBtn = `<button type="button" class="primary" data-now="1">🔄 지금 시간 기준으로 소재 후보 받기</button><div class="msg" id="nowmsg" aria-live="polite"></div>`;

      } catch {
        card.classList.remove("removing"); b.classList.remove("armed"); b.textContent = "삭제";
        msg.textContent = "삭제하지 못했어요. 잠시 뒤 다시 눌러 주세요"; return;
      }
      // 목록에서 지운 뒤 영상·카드 파일도 정리(편집 권한이 있을 때만). 다른 재료가 같은 파일을 쓰면 남겨 둔다.
      if (assets) {
        const inUse = new Set(items.filter(x => x.id !== m.id).flatMap(x => [x.reel, ...(x.cards || []), ...(x.readCards || [])]));
        const ids = [m.reel, ...(m.cards || []), ...(m.readCards || [])].filter(id => id && !inUse.has(id));
        for (const id of ids) { try { await assets.delete(id); } catch {} }
      }
    }
  });
})();
</script>
