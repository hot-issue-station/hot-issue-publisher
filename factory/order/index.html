<title>덕심저장소 쇼츠 주문판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;700;900&display=swap">
<style>
/* 레이아웃: 한 줄 세로 흐름 — 종류 2×2 → 재료 칩 → 주문 버튼 → 주문 목록 */
:root{
  --bg:#f6f4fb; --panel:#ffffff; --fg:#1d1a26; --muted:#6b6579; --line:#e2dcef;
  --accent:#6b3fd6; --accent-fg:#ffffff; --sel:#efe8ff; --ok:#1f8a4c; --warn:#b76e00;
  --display:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --body:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14121b; --panel:#1e1b28; --fg:#efeaf8; --muted:#a39cb3; --line:#332e42;
  --accent:#a383ff; --accent-fg:#14121b; --sel:#2b2342; --ok:#4cc982; --warn:#e3a640; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14121b; --panel:#1e1b28; --fg:#efeaf8; --muted:#a39cb3; --line:#332e42;
  --accent:#a383ff; --accent-fg:#14121b; --sel:#2b2342; --ok:#4cc982; --warn:#e3a640; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--body);font-size:16px;line-height:1.5}
main{max-width:560px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1{font-family:var(--display);font-weight:900;font-size:24px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
h2{font-size:15px;font-weight:700;margin:0 0 10px;color:var(--muted);letter-spacing:.02em}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 12px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:96px}
.opt b{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.opt span{font-size:14px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--sel)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:9px 14px;font:inherit;font-size:15px;color:inherit;cursor:pointer}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--sel);font-weight:700}
button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.go{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:16px;font:inherit;font-size:18px;font-weight:900;cursor:pointer;width:100%}
.go:disabled{opacity:.45;cursor:default}
.msg{font-size:14px;min-height:20px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.row div{min-width:0}
.row .t{font-weight:700}
.row .d{font-size:13px;color:var(--muted)}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.wait{color:var(--warn)} .pill.done{color:var(--ok)} .pill.work{color:var(--accent)}
.empty{color:var(--muted);font-size:14px}
</style>

<main>
  <header>
    <h1>쇼츠 주문판</h1>
    <p class="sub">종류와 재료를 누르고 「만들어 줘」를 누르면 Claude가 표준 v2대로 만듭니다. 모든 플랫폼에 같은 파일이 올라갑니다.</p>
  </header>

  <section>
    <h2>1. 종류</h2>
    <div class="grid" id="types"></div>
  </section>

  <section>
    <h2>2. 재료</h2>
    <div class="chips" id="srcs"></div>
  </section>

  <section>
    <h2>3. 분위기</h2>
    <div class="chips" id="moods"></div>
  </section>

  <section style="display:flex;flex-direction:column;gap:8px">
    <button class="go" id="go" disabled>만들어 줘</button>
    <div class="msg" id="msg" aria-live="polite"></div>
  </section>

  <section>
    <h2>주문 목록</h2>
    <div class="list" id="list"><p class="empty">아직 주문이 없어요. 위에서 골라 첫 주문을 넣어 보세요.</p></div>
  </section>
</main>

<script>
const TYPES=[
  {id:"58-N",len:"58초",name:"내레이션 있음",desc:"Veda 목소리 + 자막"},
  {id:"58-M",len:"58초",name:"무대·음악 위주",desc:"내레이션 없이 현장 소리"},
  {id:"40-N",len:"40초",name:"가벼운 내레이션",desc:"짧은 이야기 하나"},
  {id:"40-M",len:"40초",name:"가벼운 무대",desc:"한 곡 하이라이트"}
];
const SRCS=["알아서 골라 줘","안원잘부 사투리 편","엠카 6/18 LOVE ATTACK","엠카 7/9 Pretty Girl","안원잘부 제나야 편","전참시 7/11","PULSE 「With」 무대"];
const MOODS=["알아서","웃긴","뭉클한","신나는"];
const S={type:null,src:"알아서 골라 줘",mood:"알아서"};
const $=id=>document.getElementById(id);

function draw(){
  $("types").innerHTML="";
  TYPES.forEach(t=>{const b=document.createElement("button");b.className="opt";b.id="t-"+t.id;
    b.setAttribute("aria-pressed",S.type===t.id);
    b.innerHTML=`<b></b><strong></strong><span></span>`;
    b.querySelector("b").textContent=t.len;b.querySelector("strong").textContent=t.name;b.querySelector("span").textContent=t.desc;
    b.onclick=()=>{S.type=t.id;draw()};$("types").append(b)});
  chips("srcs",SRCS,"src");chips("moods",MOODS,"mood");
  $("go").disabled=!S.type;
}
function chips(el,arr,key){$(el).innerHTML="";arr.forEach((v,i)=>{const b=document.createElement("button");b.className="chip";b.id=key+"-"+i;
  b.textContent=v;b.setAttribute("aria-pressed",S[key]===v);b.onclick=()=>{S[key]=v;draw()};$(el).append(b)})}
draw();

const LABEL={wait:"대기",work:"만드는 중",done:"완성"};
function render(rows){
  const L=$("list");L.innerHTML="";
  if(!rows.length){L.innerHTML='<p class="empty">아직 주문이 없어요. 위에서 골라 첫 주문을 넣어 보세요.</p>';return}
  rows.forEach(r=>{const d=document.createElement("div");d.className="row";
    const t=TYPES.find(x=>x.id===r.type);
    d.innerHTML='<div><div class="t"></div><div class="d"></div></div><span class="pill"></span>';
    d.querySelector(".t").textContent=(t?t.len+" · "+t.name:r.type);
    d.querySelector(".d").textContent=r.src+" · "+r.mood+" · "+(r.at||"").replace("T"," ").slice(0,16)+(r.note?" · "+r.note:"");
    const p=d.querySelector(".pill");const st=r.status||"wait";p.textContent=LABEL[st]||st;p.classList.add(st);
    L.append(d)});
}

(async()=>{
  const db=await window.claude?.use?.("db");
  if(!db){$("msg").textContent="이 화면에서는 주문을 저장할 수 없어요. claude.ai에 로그인한 상태로 열어 주세요.";return}
  const col=db.collection("orders");
  const timer=setTimeout(()=>{$("msg").textContent="주문 목록을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요."},10000);
  try{
    col.orderBy("at","desc").limit(20).onSnapshot(s=>{clearTimeout(timer);
      const rows=[];s.forEach?s.forEach(d=>rows.push(d.data())):(s.docs||[]).forEach(d=>rows.push(d.data()));render(rows)},
      ()=>{clearTimeout(timer);$("msg").textContent="주문 목록을 불러오지 못했어요."});
  }catch(e){clearTimeout(timer)}
  $("go").onclick=async()=>{
    if(!S.type)return;$("go").disabled=true;$("msg").textContent="주문 넣는 중…";
    const now=new Date();const pad=n=>String(n).padStart(2,"0");
    const at=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    try{await col.doc("o"+now.getTime()).set({type:S.type,src:S.src,mood:S.mood,at,status:"wait"});
      $("msg").textContent="주문을 넣었어요. Claude가 만들면 「완성」으로 바뀝니다.";}
    catch(e){$("msg").textContent="주문을 저장하지 못했어요. 이 화면을 연 계정에 편집 권한이 있는지 확인해 주세요.";}
    $("go").disabled=false;
  };
})();
</script>
