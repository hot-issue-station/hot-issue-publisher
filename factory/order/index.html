<title>덕심저장소 쇼츠 주문판</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gothic+A1:wght@400;700;900&display=swap">
<style>
/* 레이아웃: 한 줄 세로 흐름 — 형식 → 종류 → 영역 → 소제목 → 직접 입력 → 분위기 → 주문 → 목록 */
:root{
  --bg:#f6f4fb; --panel:#ffffff; --fg:#1d1a26; --muted:#6b6579; --line:#e2dcef;
  --accent:#6b3fd6; --accent-fg:#ffffff; --sel:#efe8ff; --ok:#1f8a4c; --warn:#b76e00;
  --font:"Gothic A1","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#14121b; --panel:#1e1b28; --fg:#efeaf8; --muted:#a39cb3; --line:#332e42;
  --accent:#a383ff; --accent-fg:#14121b; --sel:#2b2342; --ok:#4cc982; --warn:#e3a640; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#14121b; --panel:#1e1b28; --fg:#efeaf8; --muted:#a39cb3; --line:#332e42;
  --accent:#a383ff; --accent-fg:#14121b; --sel:#2b2342; --ok:#4cc982; --warn:#e3a640; color-scheme:dark}
body{background:var(--bg);color:var(--fg);font-family:var(--font);font-size:16px;line-height:1.5}
main{max-width:600px;margin:0 auto;padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:22px}
h1{font-weight:900;font-size:24px;margin:0;text-wrap:balance}
.sub{color:var(--muted);font-size:14px;margin:4px 0 0}
h2{font-size:15px;font-weight:700;margin:0 0 10px;color:var(--muted);letter-spacing:.02em}
h2 small{font-weight:400}
.seg{display:grid;grid-template-columns:1fr 1fr;background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:4px;gap:4px}
.seg button{border:0;background:transparent;font:inherit;font-weight:900;font-size:17px;color:var(--muted);padding:10px;border-radius:10px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-fg)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.opt{background:var(--panel);border:2px solid var(--line);border-radius:14px;padding:14px 12px;text-align:left;font:inherit;color:inherit;cursor:pointer;display:flex;flex-direction:column;gap:4px;min-height:96px}
.opt b{font-size:22px;font-weight:900;font-variant-numeric:tabular-nums}
.opt span{font-size:14px;color:var(--muted)}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--sel)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--panel);border:2px solid var(--line);border-radius:999px;padding:9px 14px;font:inherit;font-size:15px;color:inherit;cursor:pointer;text-align:left}
.chip[aria-pressed="true"]{border-color:var(--accent);background:var(--sel);font-weight:700}
.chip .h{display:block;font-size:12px;color:var(--muted);font-weight:400}
.chip.sens::after{content:" ⚠";color:var(--warn)}
.note{font-size:13px;color:var(--warn);margin:8px 0 0}
.mg{display:flex;flex-direction:column;gap:6px;margin-bottom:12px}
.mg .gl{font-size:13px;font-weight:700}
textarea{width:100%;box-sizing:border-box;min-height:72px;border:2px solid var(--line);border-radius:12px;background:var(--panel);color:var(--fg);font:inherit;padding:10px 12px;resize:vertical}
textarea:focus,button:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.go{background:var(--accent);color:var(--accent-fg);border:0;border-radius:14px;padding:16px;font:inherit;font-size:18px;font-weight:900;cursor:pointer;width:100%}
.go:disabled{opacity:.45;cursor:default}
.summary{font-size:14px;color:var(--muted)}
.msg{font-size:14px;min-height:20px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.row{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:12px;display:flex;justify-content:space-between;gap:10px;align-items:center}
.row div{min-width:0}
.row .t{font-weight:700}
.row .d{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.pill{font-size:13px;font-weight:700;padding:4px 10px;border-radius:999px;border:1px solid currentColor;white-space:nowrap}
.pill.wait{color:var(--warn)} .pill.done{color:var(--ok)} .pill.work{color:var(--accent)}
.empty{color:var(--muted);font-size:14px}
.basis{font-size:12px;color:var(--muted)}
</style>

<main>
  <header>
    <h1>쇼츠·롱폼 주문판</h1>
    <p class="sub">눌러서 고르고 「만들어 줘」를 누르면 Claude가 제작 표준 v2대로 만듭니다.</p>
  </header>

  <section><div class="seg" id="fmt"></div></section>

  <section><h2>1. 종류</h2><div class="grid" id="types"></div></section>

  <section>
    <h2>2. 영역 <small>(유튜브 인기 기준)</small></h2>
    <div class="chips" id="areas"></div>
    <p class="note" id="areaNote" hidden></p>
  </section>

  <section id="subWrap" hidden>
    <h2>3. 소제목 <small>(여러 개 골라도 돼요)</small></h2>
    <div class="chips" id="subs"></div>
  </section>

  <section>
    <h2>4. 직접 쓰기 <small>(선택)</small></h2>
    <textarea id="free" placeholder="예) 리센느 데뷔 첫 음방 vs 지금 비교, 메이 웃는 장면 위주로"></textarea>
  </section>

  <section>
    <h2>5. 분위기 <small>(최대 3개)</small></h2>
    <div id="moods"></div>
  </section>

  <section style="display:flex;flex-direction:column;gap:8px">
    <div class="summary" id="sum"></div>
    <button class="go" id="go" disabled>만들어 줘</button>
    <div class="msg" id="msg" aria-live="polite"></div>
  </section>

  <section>
    <h2>주문 목록</h2>
    <div class="list" id="list"><p class="empty">아직 주문이 없어요. 위에서 골라 첫 주문을 넣어 보세요.</p></div>
  </section>

  <p class="basis" id="basis"></p>
</main>

<script>
const FMT={
  shorts:{name:"쇼츠",types:[
    {id:"58-N",len:"58초",name:"내레이션 있음",desc:"Veda 목소리 + 자막"},
    {id:"58-M",len:"58초",name:"무대·음악 위주",desc:"내레이션 없이 현장 소리"},
    {id:"40-N",len:"40초",name:"가벼운 내레이션",desc:"짧은 이야기 하나"},
    {id:"40-M",len:"40초",name:"가벼운 무대",desc:"한 곡 하이라이트"}]},
  long:{name:"롱폼",types:[
    {id:"L8-N",len:"약 8분",name:"몰아보기 내레이션",desc:"Veda 내레이션 + 괄호 자막"},
    {id:"L8-M",len:"약 8분",name:"무대·음악 모음",desc:"내레이션 없이 무대 위주"},
    {id:"L4-N",len:"약 4분",name:"가벼운 내레이션",desc:"이야기 한 가지"},
    {id:"L4-M",len:"약 4분",name:"가벼운 무대 모음",desc:"한 곡·한 무대 중심"}]}
};
let CAT={areas:[],moods:[]};
const S={fmt:"shorts",type:null,area:null,subs:[],moods:[]};
const $=id=>document.getElementById(id);
const mk=(cls,txt)=>{const b=document.createElement("button");b.type="button";b.className=cls;b.textContent=txt;return b};

function draw(){
  $("fmt").innerHTML="";
  Object.entries(FMT).forEach(([k,f])=>{const b=mk("",f.name);b.id="fmt-"+k;b.setAttribute("aria-pressed",S.fmt===k);
    b.onclick=()=>{S.fmt=k;S.type=null;draw()};$("fmt").append(b)});
  $("types").innerHTML="";
  FMT[S.fmt].types.forEach(t=>{const b=mk("opt","");b.id="t-"+t.id;b.setAttribute("aria-pressed",S.type===t.id);
    b.innerHTML="<b></b><strong></strong><span></span>";
    b.querySelector("b").textContent=t.len;b.querySelector("strong").textContent=t.name;b.querySelector("span").textContent=t.desc;
    b.onclick=()=>{S.type=t.id;draw()};$("types").append(b)});
  $("areas").innerHTML="";
  CAT.areas.forEach(a=>{const b=mk("chip"+(a.sensitive?" sens":""),a.name);b.id="a-"+a.id;b.setAttribute("aria-pressed",S.area===a.id);
    b.onclick=()=>{S.area=S.area===a.id?null:a.id;S.subs=[];draw()};$("areas").append(b)});
  const area=CAT.areas.find(a=>a.id===S.area);
  $("areaNote").hidden=!(area&&area.note);if(area&&area.note)$("areaNote").textContent=area.note;
  $("subWrap").hidden=!area;$("subs").innerHTML="";
  if(area)area.subs.forEach((s,i)=>{const b=mk("chip",s.name);b.id="s-"+area.id+"-"+i;
    if(s.hint){const h=document.createElement("span");h.className="h";h.textContent=s.hint;b.append(h)}
    b.setAttribute("aria-pressed",S.subs.includes(s.name));
    b.onclick=()=>{S.subs=S.subs.includes(s.name)?S.subs.filter(x=>x!==s.name):[...S.subs,s.name];draw()};$("subs").append(b)});
  $("moods").innerHTML="";
  CAT.moods.forEach((g,gi)=>{const w=document.createElement("div");w.className="mg";
    const l=document.createElement("div");l.className="gl";l.textContent=g.group;w.append(l);
    const c=document.createElement("div");c.className="chips";
    g.items.forEach((m,i)=>{const b=mk("chip",m);b.id="m-"+gi+"-"+i;b.setAttribute("aria-pressed",S.moods.includes(m));
      b.onclick=()=>{if(S.moods.includes(m))S.moods=S.moods.filter(x=>x!==m);else if(S.moods.length<3)S.moods=[...S.moods,m];draw()};c.append(b)});
    w.append(c);$("moods").append(w)});
  const t=FMT[S.fmt].types.find(x=>x.id===S.type);
  const free=$("free").value.trim();
  $("sum").textContent=t?`${FMT[S.fmt].name} ${t.len} · ${t.name}`+(area?` · ${area.name}`:"")+(S.subs.length?` · ${S.subs.join(", ")}`:"")+(S.moods.length?` · ${S.moods.join(", ")}`:""):"종류를 먼저 골라 주세요.";
  $("go").disabled=!t||!(area||free);
}
$("free").addEventListener("input",draw);

fetch("catalog.json").then(r=>r.json()).then(c=>{CAT=c;$("basis").textContent=`인기 기준: ${c.basis} · 갱신 ${c.updatedAt}`;draw()}).catch(()=>{$("basis").textContent="인기 목록을 불러오지 못했어요. 직접 쓰기 칸으로 주문할 수 있어요.";draw()});
draw();

const LABEL={wait:"대기",work:"만드는 중",done:"완성"};
const ALLT=[...FMT.shorts.types,...FMT.long.types];
function render(rows){
  const L=$("list");L.innerHTML="";
  if(!rows.length){L.innerHTML='<p class="empty">아직 주문이 없어요. 위에서 골라 첫 주문을 넣어 보세요.</p>';return}
  rows.forEach(r=>{const d=document.createElement("div");d.className="row";
    const t=ALLT.find(x=>x.id===r.type);
    d.innerHTML='<div><div class="t"></div><div class="d"></div></div><span class="pill"></span>';
    d.querySelector(".t").textContent=(r.format==="long"?"롱폼 ":"쇼츠 ")+(t?t.len+" · "+t.name:r.type);
    d.querySelector(".d").textContent=[r.area,(r.subs||[]).join(", "),(r.moods||[]).join(", "),r.free,(r.at||"").replace("T"," ").slice(5,16),r.note].filter(Boolean).join(" · ");
    const p=d.querySelector(".pill");const st=r.status||"wait";p.textContent=LABEL[st]||st;p.classList.add(st);
    L.append(d)});
}

(async()=>{
  const db=await window.claude?.use?.("db");
  if(!db){$("msg").textContent="이 화면에서는 주문을 저장할 수 없어요. claude.ai에 로그인한 상태로 열어 주세요.";return}
  const col=db.collection("orders");
  const timer=setTimeout(()=>{$("msg").textContent="주문 목록을 불러오지 못했어요. 잠시 뒤 다시 열어 주세요."},10000);
  try{
    col.orderBy("at","desc").limit(20).onSnapshot(s=>{clearTimeout(timer);
      const rows=[];(s.docs||[]).forEach(d=>rows.push(d.data()));if(!s.docs&&s.forEach)s.forEach(d=>rows.push(d.data()));render(rows)},
      ()=>{clearTimeout(timer);$("msg").textContent="주문 목록을 불러오지 못했어요."});
  }catch(e){clearTimeout(timer)}
  $("go").onclick=async()=>{
    if($("go").disabled)return;$("go").disabled=true;$("msg").textContent="주문 넣는 중…";
    const now=new Date();const pad=n=>String(n).padStart(2,"0");
    const at=`${now.getFullYear()}-${pad(now.getMonth()+1)}-${pad(now.getDate())}T${pad(now.getHours())}:${pad(now.getMinutes())}:${pad(now.getSeconds())}`;
    const area=CAT.areas.find(a=>a.id===S.area);
    try{await col.doc("o"+now.getTime()).set({format:S.fmt,type:S.type,area:area?area.name:"",sensitive:!!(area&&area.sensitive),subs:S.subs,moods:S.moods,free:$("free").value.trim().slice(0,500),at,status:"wait"});
      $("msg").textContent="주문을 넣었어요. Claude가 만들면 「완성」으로 바뀝니다.";$("free").value="";}
    catch(e){$("msg").textContent="주문을 저장하지 못했어요. 이 화면을 연 계정에 편집 권한이 있는지 확인해 주세요.";}
    draw();
  };
})();
</script>
