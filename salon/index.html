<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>단골 수첩</title>
<meta name="description" content="동네 미용실 원장님용 단골 기록장: 손님 찾기·시술 기록·문자·매출을 큰 글씨로">
<style>
:root{--bg:#fff8f3;--card:#fff;--tx:#2b2220;--sub:#7a6a64;--main:#c2410c;--line:#ead9cf;--soft:#fdeee4;--ok:#16a34a;--bl:#2563eb}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans KR",system-ui,sans-serif;font-size:20px;padding-bottom:84px}
header{background:var(--main);color:#fff;padding:16px;display:flex;justify-content:space-between;align-items:center;position:sticky;top:0;z-index:3}
header h1{margin:0;font-size:25px}
header button{background:#fff2;color:#fff;border:1px solid #fff8;border-radius:10px;padding:8px 12px;font-size:16px}
main{max-width:560px;margin:0 auto;padding:16px}
nav.tabs{position:fixed;bottom:0;left:0;right:0;display:flex;background:#fff;border-top:2px solid var(--line);z-index:3}
nav.tabs button{flex:1;border:0;background:none;padding:12px 0 14px;font-size:17px;color:var(--sub)}
nav.tabs button b{display:block;font-size:24px}
nav.tabs button.on{color:var(--main);font-weight:700}
input,textarea,select{width:100%;font-size:22px;padding:14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--tx)}
textarea{min-height:80px}
.big{display:block;width:100%;font-size:22px;font-weight:700;padding:16px;border:0;border-radius:14px;background:var(--main);color:#fff;margin-top:12px}
.ghost{background:var(--soft);color:var(--main)}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px}
.cust{display:flex;justify-content:space-between;align-items:center}
.cust b{font-size:23px}.cust small{display:block;color:var(--sub);font-size:17px;margin-top:4px}
.rec{background:var(--card);border-radius:16px;padding:14px 16px;margin-top:12px;border-left:6px solid var(--main)}
.d{color:var(--sub);font-size:17px}.t{font-weight:700;font-size:22px;margin:4px 0}
.rec img{width:100%;border-radius:12px;margin-top:8px}
label{display:block;margin:16px 0 6px;font-weight:700}
.hide{display:none!important}
.note{color:var(--sub);font-size:16px;line-height:1.5;margin-top:14px}
.two{display:flex;gap:10px;margin-top:12px}.two>*{flex:1;text-align:center;text-decoration:none;font-size:22px;font-weight:700;padding:16px;border-radius:14px;border:0;color:#fff}
.sms{background:var(--ok)}.call{background:var(--bl)}
.sum{display:flex;gap:10px}.sum .card{flex:1;text-align:center}.sum b{display:block;font-size:26px;color:var(--main);margin-top:4px}
h2{font-size:21px;margin:22px 0 4px}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{border:2px solid var(--line);background:#fff;border-radius:22px;padding:10px 14px;font-size:19px}
.chip.on{background:var(--main);border-color:var(--main);color:#fff;font-weight:700}
.mrow{display:flex;gap:8px;align-items:center;margin-top:8px}.mrow input{padding:10px}.mrow .n{flex:2}.mrow .p{flex:1.2}
.bar{height:12px;background:var(--soft);border-radius:6px;margin-top:6px}.bar i{display:block;height:100%;background:var(--main);border-radius:6px}
</style>
</head>
<body>
<header><h1 id="hd">단골 수첩</h1><button id="backBtn" class="hide">← 뒤로</button></header>
<main>

<!-- 처음 실행: 업종 고르기 -->
<section id="setup" class="hide">
  <h2>어떤 가게세요?</h2>
  <p class="note">고르시면 기본 시술 메뉴와 가격이 자동으로 들어가요. 가격은 나중에 바꾸실 수 있어요.</p>
  <div class="chips" id="bizChips"></div>
  <label>가게 이름</label><input id="shopName" placeholder="예: 하나 헤어">
  <button class="big" onclick="finishSetup()">시작하기</button>
</section>

<!-- 오늘 -->
<section id="today" class="hide">
  <div class="card" id="signal" style="display:flex;gap:14px;align-items:center"></div>
  <div class="sum"><div class="card">오늘 손님<b id="tCnt">0</b></div><div class="card">오늘 매출<b id="tSum">0</b></div></div>
  <button class="big" onclick="go('pick')">+ 시술 기록하기</button>
  <h2>오늘 기록</h2><div id="tList"></div>
  <h2>오래 안 오신 손님</h2><p class="note" style="margin-top:0">마지막 방문 뒤 60일이 지난 분이에요. 문자로 안부를 전해 보세요.</p><div id="longList"></div>
</section>

<!-- 손님 목록 -->
<section id="list" class="hide">
  <input id="q" placeholder="이름이나 전화번호 뒷자리" oninput="drawList()" autocomplete="off">
  <button class="big" onclick="go('newCust')">+ 새 손님</button>
  <div id="custs"></div>
  <p class="note" id="stat"></p>
</section>

<!-- 기록할 손님 고르기 -->
<section id="pick" class="hide">
  <input id="pq" placeholder="누구 시술하셨어요? (이름·번호)" oninput="drawPick()" autocomplete="off">
  <div id="pickList"></div>
  <button class="big ghost" onclick="pickNew=true;go('newCust')">처음 오신 손님이에요</button>
</section>

<!-- 새 손님 -->
<section id="newCust" class="hide">
  <label>이름</label><input id="cn">
  <label>전화번호</label><input id="cp" type="tel" placeholder="010-">
  <label>메모 (모발 상태, 좋아하는 스타일 등)</label><textarea id="cm"></textarea>
  <label style="font-weight:400"><input type="checkbox" id="agree" style="width:auto"> 손님이 연락처·사진 보관에 동의했어요</label>
  <button class="big" onclick="saveCust()">저장</button>
</section>

<!-- 손님 상세 -->
<section id="detail" class="hide">
  <div id="info"></div>
  <div class="two"><a id="smsBtn" class="sms">문자 보내기</a><a id="callBtn" class="call">전화</a></div>
  <button class="big" onclick="go('newRec')">+ 오늘 시술 기록</button>
  <a class="big ghost" style="text-align:center;text-decoration:none" href="color.html">🎨 염색 미리보기 (손님 사진으로)</a>
  <div id="recs"></div>
  <button class="big ghost" onclick="editMemo()">메모 고치기</button>
  <button class="big ghost" onclick="delCust()">이 손님 삭제</button>
</section>

<!-- 시술 기록 -->
<section id="newRec" class="hide">
  <label>시술 (여러 개 고르셔도 돼요)</label>
  <div class="chips" id="menuChips"></div>
  <label>금액</label><input id="rp" type="number" inputmode="numeric" placeholder="원">
  <label>약·호수·시간 (다음에 똑같이 하려면)</label><textarea id="rm" placeholder="예: 7호 + 산화제 6%, 25분"></textarea>
  <label>날짜</label><input id="rd" type="date">
  <label>사진 (선택)</label><input id="rf" type="file" accept="image/*" capture="environment">
  <button class="big" onclick="saveRec()">기록 저장</button>
</section>

<!-- 매출 -->
<section id="sales" class="hide">
  <div class="chips" id="periodChips"></div>
  <div class="sum" style="margin-top:12px"><div class="card">손님 수<b id="sCnt">0</b></div><div class="card">매출<b id="sSum">0</b></div></div>
  <h2>시술별</h2><div id="byMenu"></div>
</section>

<!-- 설정 -->
<section id="settings" class="hide">
  <h2>이번 달 매출 목표</h2>
  <input id="goal" type="number" inputmode="numeric" placeholder="예: 5000000" onchange="db.goal=Number(this.value)||0;save()">
  <h2>시술 메뉴·가격</h2>
  <div id="menuEdit"></div>
  <button class="big ghost" onclick="addMenu()">+ 메뉴 추가</button>
  <button class="big" onclick="saveMenu()">메뉴 저장</button>
  <h2>기록 지키기</h2>
  <p class="note" style="margin-top:0">기록은 이 휴대폰 안에만 있어요. 휴대폰을 바꾸거나 인터넷 기록을 지우면 사라질 수 있으니 한 달에 한 번 백업해 주세요.</p>
  <button class="big ghost" onclick="backup()">백업 파일로 저장</button>
  <button class="big ghost" onclick="document.getElementById('restore').click()">백업 파일 불러오기</button>
  <input type="file" id="restore" accept=".json" class="hide" onchange="restore(this.files[0])">
</section>

</main>
<nav class="tabs" id="tabs">
  <button data-v="today" onclick="go('today')"><b>☀</b>오늘</button>
  <button data-v="list" onclick="go('list')"><b>☺</b>손님</button>
  <button data-v="sales" onclick="go('sales')"><b>₩</b>매출</button>
  <button data-v="settings" onclick="go('settings')"><b>⚙</b>설정</button>
</nav>
<script>
/* 업종별 기본 메뉴 (가격은 예시, 원장님이 바꿈) */
const PRESET={
  "헤어":[["여성 커트",20000],["남성 커트",15000],["앞머리",5000],["일반 펌",70000],["디지털 펌",120000],["셋팅 펌",100000],["다운 펌",30000],["뿌리 염색",50000],["전체 염색",80000],["매직",120000],["클리닉",50000],["드라이",15000]],
  "바버":[["커트",20000],["페이드 커트",25000],["면도",10000],["다운 펌",30000],["염색",40000]],
  "네일":[["젤 원컬러",40000],["젤 아트",60000],["젤 제거",10000],["케어",15000],["패디 젤",50000]],
  "속눈썹":[["연장",50000],["리터치",30000],["펌",40000],["제거",10000]],
  "피부":[["기본 관리",50000],["여드름 관리",60000],["리프팅",80000],["각질 관리",40000]],
  "기타":[["기본 시술",30000]]
};
const KEY="dangol_v1"; let db={c:[]}, cur=null, view=null, stack=[], pickNew=false, period="이번 달";
try{ db=JSON.parse(localStorage.getItem(KEY))||{c:[]} }catch(e){}
function save(){ try{ localStorage.setItem(KEY,JSON.stringify(db)) }catch(e){ alert("저장 공간이 부족해요. 백업 후 오래된 사진을 지워 주세요.") } }
const $=id=>document.getElementById(id);
const won=n=>Number(n||0).toLocaleString()+"원";
const today=()=>new Date().toISOString().slice(0,10);
const days=d=>Math.round((Date.now()-new Date(d))/864e5);
function esc(s){return String(s??"").replace(/[&<>"']/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[m]))}
const TITLES={today:()=>db.shop||"단골 수첩",list:()=>"손님",pick:()=>"누구 시술하셨어요?",newCust:()=>"새 손님",detail:()=>cur.n+" 님",newRec:()=>cur.n+" 님 시술",sales:()=>"매출",settings:()=>"설정",setup:()=>"단골 수첩 시작"};
const TAB=["today","list","sales","settings"];
function go(v,back){
  if(!back && view && v!==view && !TAB.includes(v)) stack.push(view);
  if(TAB.includes(v)) stack=[];
  view=v;
  document.querySelectorAll("main>section").forEach(s=>s.classList.toggle("hide",s.id!==v));
  $("tabs").classList.toggle("hide",v==="setup");
  document.querySelectorAll("#tabs button").forEach(b=>b.classList.toggle("on",b.dataset.v===v));
  $("backBtn").classList.toggle("hide",!stack.length); $("hd").textContent=TITLES[v](); window.scrollTo(0,0);
  ({today:drawToday,list:drawList,pick:drawPick,newCust:resetCust,detail:drawDetail,newRec:resetRec,sales:drawSales,settings:drawSettings,setup:drawSetup}[v]||(()=>{}))();
}
$("backBtn").onclick=()=>go(stack.pop()||"today",true);
function last(c){ return c.r.length? c.r[c.r.length-1] : null }
function custRow(c,fn){const l=last(c);return `<div class="card cust" onclick="${fn}('${c.id}')"><div><b>${esc(c.n)}</b><small>${l?`${l.d} · ${esc(l.t)}`:"아직 기록 없음"}</small></div><span>›</span></div>`}
function match(c,q){q=q.replace(/-/g,"");return !q||c.n.includes(q)||c.p.replace(/-/g,"").includes(q)}
/* 처음 실행 */
let biz="헤어";
function drawSetup(){ $("bizChips").innerHTML=Object.keys(PRESET).map(k=>`<button class="chip ${k===biz?'on':''}" onclick="biz='${k}';drawSetup()">${k}</button>`).join("") }
function finishSetup(){ db.biz=biz; db.shop=$("shopName").value.trim()||"단골 수첩"; db.menu=PRESET[biz].map(([n,p])=>({n,p})); save(); go("today") }
/* 오늘 */
function drawToday(){
  /* 신호등: 이번 달 목표 대비, 달의 지난 날짜만큼 따라왔는지 */
  const now=new Date(), dim=new Date(now.getFullYear(),now.getMonth()+1,0).getDate(), pace=now.getDate()/dim;
  let month=0; db.c.forEach(c=>c.r.forEach(r=>{ if(r.d.slice(0,7)===today().slice(0,7)) month+=Number(r.price||0) }));
  if(db.goal){ const ratio=month/db.goal, c=ratio>=pace?["#16a34a","순조로워요"]:ratio>=pace*0.8?["#eab308","조금 느려요"]:["#dc2626","조금 더 힘내 봐요"];
    $("signal").innerHTML=`<span style="width:44px;height:44px;border-radius:50%;background:${c[0]};flex:none"></span><div><b style="font-size:22px">${c[1]}</b><div class="d">이번 달 ${won(month)} / 목표 ${won(db.goal)} (${Math.round(ratio*100)}%)</div><div class="bar"><i style="width:${Math.min(100,ratio*100)}%"></i></div></div>`;
  } else $("signal").innerHTML=`<div class="d" onclick="go('settings')">이번 달 매출 목표를 정하시면 신호등으로 보여 드려요 › 설정</div>`;
  const t=today(), rows=[];
  db.c.forEach(c=>c.r.forEach(r=>{ if(r.d===t) rows.push([c,r]) }));
  $("tCnt").textContent=rows.length+"명"; $("tSum").textContent=won(rows.reduce((a,[,r])=>a+Number(r.price||0),0));
  $("tList").innerHTML=rows.map(([c,r])=>`<div class="rec" onclick="openC('${c.id}')"><div class="t">${esc(c.n)}</div><div class="d">${esc(r.t)} · ${won(r.price)}</div></div>`).join("")||`<p class="note">아직 오늘 기록이 없어요.</p>`;
  const longs=db.c.filter(c=>last(c)&&days(last(c).d)>=60).sort((a,b)=>last(a).d.localeCompare(last(b).d)).slice(0,10);
  $("longList").innerHTML=longs.map(c=>`<div class="card cust"><div onclick="openC('${c.id}')"><b>${esc(c.n)}</b><small>${days(last(c).d)}일 전 · ${esc(last(c).t)}</small></div><a class="chip" style="background:var(--ok);color:#fff;border:0;text-decoration:none" href="${smsHref(c)}">문자</a></div>`).join("")||`<p class="note">모두 잘 오고 계세요!</p>`;
}
/* 손님 */
function drawList(){
  const q=$("q").value.trim();
  const list=db.c.filter(c=>match(c,q)).sort((a,b)=>((last(b)||{}).d||"").localeCompare((last(a)||{}).d||""));
  $("custs").innerHTML=list.map(c=>custRow(c,"openC")).join("")||`<p class="note">${q?"찾는 손님이 없어요":"아직 손님이 없어요. '+ 새 손님'을 눌러 주세요."}</p>`;
  $("stat").textContent=`단골 ${db.c.length}명`;
}
function drawPick(){ const q=$("pq").value.trim(); $("pickList").innerHTML=db.c.filter(c=>match(c,q)).slice(0,30).map(c=>custRow(c,"pickC")).join("") }
function pickC(id){ cur=db.c.find(c=>c.id===id); go("newRec") }
function openC(id){ cur=db.c.find(c=>c.id===id); go("detail") }
function resetCust(){ ["cn","cp","cm"].forEach(i=>$(i).value=""); $("agree").checked=false }
function saveCust(){
  const n=$("cn").value.trim(), p=$("cp").value.trim();
  if(!n) return alert("이름을 적어 주세요");
  if(!$("agree").checked) return alert("손님 동의를 받은 뒤 체크해 주세요");
  const c={id:Date.now().toString(36),n,p,m:$("cm").value.trim(),r:[]}; db.c.push(c); save(); cur=c;
  if(pickNew){ pickNew=false; stack=["today"]; go("newRec",true) } else go("detail");
}
function smsHref(c){ const l=last(c), tel=c.p.replace(/[^0-9]/g,"");
  return `sms:${tel}?body=${encodeURIComponent(`${c.n} 님, 안녕하세요. ${db.shop&&db.shop!=="단골 수첩"?db.shop+"입니다. ":""}지난번 ${l?l.t:"시술"} 받으신 지 시간이 좀 지났네요. 편하실 때 연락 주세요 :)`)}` }
function drawDetail(){
  const l=last(cur);
  $("info").innerHTML=`<div class="rec"><div class="t">${esc(cur.n)}</div><div class="d">${esc(cur.p)}</div>${cur.m?`<p>${esc(cur.m)}</p>`:""}${l?`<p class="d">마지막 방문 ${l.d} (${days(l.d)}일 전) · 방문 ${cur.r.length}번</p>`:""}</div>`;
  $("smsBtn").href=smsHref(cur); $("callBtn").href=`tel:${cur.p.replace(/[^0-9]/g,"")}`;
  $("recs").innerHTML=cur.r.slice().reverse().map(r=>`<div class="rec"><div class="d">${r.d}${r.price?` · ${won(r.price)}`:""}</div><div class="t">${esc(r.t)}</div>${r.m?`<div>${esc(r.m)}</div>`:""}${r.img?`<img src="${r.img}" alt="시술 사진">`:""}</div>`).join("");
}
function editMemo(){ const m=prompt("메모",cur.m||""); if(m!==null){ cur.m=m; save(); drawDetail() } }
function delCust(){ if(confirm(cur.n+" 님 기록을 모두 지울까요?")){ db.c=db.c.filter(c=>c!==cur); save(); go("list") } }
/* 시술 기록 */
let sel=[];
function resetRec(){ sel=[]; $("rd").value=today(); $("rm").value=""; $("rp").value=""; $("rf").value=""; drawMenuChips() }
function drawMenuChips(){ $("menuChips").innerHTML=(db.menu||[]).map((m,i)=>`<button class="chip ${sel.includes(i)?'on':''}" onclick="toggleM(${i})">${esc(m.n)}</button>`).join("") }
function toggleM(i){ sel=sel.includes(i)?sel.filter(x=>x!==i):[...sel,i]; drawMenuChips(); $("rp").value=sel.reduce((a,j)=>a+Number(db.menu[j].p||0),0)||"" }
function shrink(file){return new Promise(res=>{ if(!file) return res(null);
  const img=new Image(); img.onload=()=>{const s=Math.min(1,640/Math.max(img.width,img.height)), cv=document.createElement("canvas");
    cv.width=img.width*s; cv.height=img.height*s; cv.getContext("2d").drawImage(img,0,0,cv.width,cv.height); res(cv.toDataURL("image/jpeg",0.7))};
  img.src=URL.createObjectURL(file) })}
async function saveRec(){
  if(!sel.length) return alert("시술을 골라 주세요");
  const r={d:$("rd").value,t:sel.map(i=>db.menu[i].n).join(" + "),m:$("rm").value.trim(),price:$("rp").value,img:await shrink($("rf").files[0])};
  cur.r.push(r); cur.r.sort((a,b)=>a.d.localeCompare(b.d)); save(); stack=["list"]; go("detail",true);
}
/* 매출 */
function inPeriod(d){ const t=new Date(), x=new Date(d);
  if(period==="오늘") return d===today();
  if(period==="이번 주"){ const s=new Date(t); s.setDate(t.getDate()-((t.getDay()+6)%7)); s.setHours(0,0,0,0); return x>=s }
  if(period==="이번 달") return d.slice(0,7)===today().slice(0,7);
  if(period==="지난달"){ const p=new Date(t.getFullYear(),t.getMonth()-1,1); return d.slice(0,7)===p.toISOString().slice(0,7) } }
function drawSales(){
  $("periodChips").innerHTML=["오늘","이번 주","이번 달","지난달"].map(p=>`<button class="chip ${p===period?'on':''}" onclick="period='${p}';drawSales()">${p}</button>`).join("");
  const rs=[]; db.c.forEach(c=>c.r.forEach(r=>{ if(inPeriod(r.d)) rs.push(r) }));
  $("sCnt").textContent=rs.length+"명"; $("sSum").textContent=won(rs.reduce((a,r)=>a+Number(r.price||0),0));
  const by={}; rs.forEach(r=>r.t.split(" + ").forEach(n=>by[n]=(by[n]||0)+1));
  const mx=Math.max(1,...Object.values(by));
  $("byMenu").innerHTML=Object.entries(by).sort((a,b)=>b[1]-a[1]).map(([n,k])=>`<div class="card"><div class="cust"><b style="font-size:20px">${esc(n)}</b><span>${k}번</span></div><div class="bar"><i style="width:${k/mx*100}%"></i></div></div>`).join("")||`<p class="note">이 기간 기록이 없어요.</p>`;
}
/* 설정 */
function drawSettings(){ $("goal").value=db.goal||""; $("menuEdit").innerHTML=(db.menu||[]).map((m,i)=>`<div class="mrow"><input class="n" value="${esc(m.n)}" data-i="${i}" data-k="n"><input class="p" type="number" value="${m.p}" data-i="${i}" data-k="p"><button class="chip" onclick="db.menu.splice(${i},1);drawSettings()">빼기</button></div>`).join("") }
function addMenu(){ syncMenu(); (db.menu=db.menu||[]).push({n:"새 시술",p:0}); drawSettings() }
function syncMenu(){ document.querySelectorAll("#menuEdit input").forEach(el=>{ db.menu[el.dataset.i][el.dataset.k]=el.dataset.k==="p"?Number(el.value):el.value }) }
function saveMenu(){ syncMenu(); save(); alert("메뉴를 저장했어요") }
function backup(){ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([JSON.stringify(db)],{type:"application/json"}));
  a.download=`단골수첩_백업_${today()}.json`; a.click() }
function restore(f){ if(!f) return; const fr=new FileReader(); fr.onload=()=>{ try{ const d=JSON.parse(fr.result); if(!d.c) throw 0;
  if(confirm(`백업의 손님 ${d.c.length}명으로 바꿀까요?`)){ db=d; save(); go("today") } }catch(e){ alert("백업 파일이 아니에요") } }; fr.readAsText(f) }
go(db.menu?"today":"setup");
</script>
