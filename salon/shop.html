<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>장보기 · 단골 수첩</title>
<meta name="theme-color" content="#c2410c">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="description" content="원장님이 말로 조건을 말하면 가장 싼 것과 평점·리뷰 많은 것을 골라 드리는 미용실 장보기">
<style>
:root{--bg:#fff8f3;--card:#fff;--tx:#2b2220;--sub:#6f605a;--main:#c2410c;--main2:#9a330a;--line:#ead9cf;--soft:#fdeee4;--ok:#15803d;--warn:#b45309;--gold:#a16207}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:"Noto Sans KR",system-ui,-apple-system,sans-serif;font-size:20px;line-height:1.45;padding-bottom:40px}
header{background:var(--main);color:#fff;padding:12px 16px;display:flex;gap:10px;align-items:center;position:sticky;top:0;z-index:5}
header h1{margin:0;font-size:24px;flex:1}
header a,header button{color:#fff;background:#ffffff22;border:1px solid #ffffff88;border-radius:10px;padding:8px 12px;font-size:17px;text-decoration:none;font-family:inherit}
main{max-width:560px;margin:0 auto;padding:12px 16px}
.card{background:var(--card);border:2px solid var(--line);border-radius:16px;padding:14px 16px;margin-top:12px}
.hide{display:none!important}
.note{color:var(--sub);font-size:16px;margin:8px 0 0}
button{font-family:inherit;cursor:pointer}
/* 무료인 이유 */
.free{background:#fff4e6;border-color:#f5c9a6}
.free summary{font-weight:700;font-size:19px;list-style:none}
.free summary::-webkit-details-marker{display:none}
.free summary::after{content:" ▾";color:var(--sub)}
.free[open] summary::after{content:" ▴"}
.free p{margin:8px 0 0;font-size:17px}
.sample{background:#fef3c7;border:2px dashed #d97706;color:#78350f;border-radius:14px;padding:10px 14px;margin-top:12px;font-size:17px;font-weight:700;text-align:center}
/* 검색 */
.mic{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;font-size:26px;font-weight:800;padding:20px;border:0;border-radius:18px;background:var(--main);color:#fff;box-shadow:0 4px 0 var(--main2)}
.mic:active{transform:translateY(2px);box-shadow:0 2px 0 var(--main2)}
.mic.on{background:#dc2626;animation:pulse 1.2s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 10px #dc262633}}
.row{display:flex;gap:8px;margin-top:12px}
.row input{flex:1;min-width:0;font-size:21px;padding:14px;border:2px solid var(--line);border-radius:14px;background:#fff;color:var(--tx)}
.row input:focus{outline:3px solid #fdba74;border-color:var(--main)}
.go{font-size:21px;font-weight:700;padding:0 18px;border:0;border-radius:14px;background:#2b2220;color:#fff}
.listen{margin-top:10px;font-size:18px;color:var(--main);font-weight:700;text-align:center}
.guide{margin-top:10px;background:var(--soft);border-radius:12px;padding:10px 12px;font-size:17px}
.ex{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.ex button{font-size:16px;padding:8px 10px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--sub)}
/* 탭·바로가기 */
.seg{display:flex;background:#f3e4da;border-radius:14px;padding:4px;margin-top:14px}
.seg button{flex:1;border:0;background:none;font-size:19px;padding:10px;border-radius:10px;color:var(--sub);font-weight:700}
.seg button.on{background:#fff;color:var(--main);box-shadow:0 1px 3px #0002}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-top:10px}
.grid button{background:#fff;border:2px solid var(--line);border-radius:14px;padding:10px 2px;font-size:15px;color:var(--tx);display:flex;flex-direction:column;align-items:center;gap:2px;min-height:76px}
.grid button b{font-size:26px;font-weight:400}
.idea{border-left:8px solid var(--c)}
.idea h3{margin:0;font-size:21px}
.idea p{margin:6px 0 0;font-size:17px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px}
.chip{font-size:16px;padding:8px 12px;border-radius:999px;border:1.5px solid var(--line);background:#fff;color:var(--tx)}
.chip.c{background:var(--soft);border-color:#f5c9a6;color:var(--main2);font-weight:700}
.chip.c i{font-style:normal;margin-left:6px;color:var(--sub)}
h2{font-size:20px;margin:18px 0 0}
.mine .chip{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hist{display:flex;justify-content:space-between;gap:8px;align-items:center;border-top:1px solid var(--line);padding:10px 0}
.hist:first-child{border-top:0}
.hist small{display:block;color:var(--sub);font-size:15px}
.hist button{flex:none;font-size:16px;padding:8px 10px;border-radius:10px;border:0;background:var(--soft);color:var(--main2);font-weight:700}
/* 결과 */
.understood{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-top:8px}
.understood .lab{font-size:16px;color:var(--sub)}
.disc{background:#f8fafc;border:2px solid #cbd5e1;border-radius:14px;padding:10px 12px;margin-top:12px;font-size:15.5px;color:#334155}
.disc p{margin:0 0 4px}
.relax{background:#fffbeb;border:2px solid #fcd34d;border-radius:12px;padding:8px 12px;margin-top:10px;font-size:16px}
.res{position:relative}
.res .top{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.src{font-size:14px;font-weight:800;color:#fff;border-radius:6px;padding:2px 8px}
.bdg{font-size:15px;font-weight:800;border-radius:999px;padding:3px 10px}
.bdg.cheap{background:#dcfce7;color:var(--ok)}
.bdg.best{background:#fef9c3;color:var(--gold)}
.res h3{margin:8px 0 2px;font-size:20px;line-height:1.35}
.price{font-size:28px;font-weight:800}
.unit{font-size:16px;color:var(--sub);margin-left:6px;font-weight:400}
.meta{font-size:17px;color:var(--sub);margin-top:2px}
.meta b{color:var(--tx)}
.why{margin-top:8px;font-size:17px;background:var(--soft);border-radius:10px;padding:8px 10px}
.why::before{content:"추천 이유  ";font-weight:800;color:var(--main2)}
.qty{display:flex;align-items:center;gap:10px;margin-top:10px;flex-wrap:wrap}
.qty .st{display:flex;align-items:center;border:2px solid var(--line);border-radius:12px;overflow:hidden}
.qty .st button{width:48px;height:48px;font-size:26px;border:0;background:#fff;color:var(--main)}
.qty .st output{min-width:46px;text-align:center;font-size:22px;font-weight:800}
.qty .sum{font-size:18px}
.qty .sum b{font-size:21px}
.buy{display:block;text-align:center;margin-top:10px;font-size:21px;font-weight:800;padding:15px;border-radius:14px;color:#fff;text-decoration:none}
.buy small{display:block;font-size:14px;font-weight:400;opacity:.9}
.hint{font-size:15px;color:var(--sub);margin-top:6px;text-align:center}
details.few{margin-top:12px;font-size:17px;color:var(--sub)}
details.few li{margin-top:4px}
.empty{text-align:center;color:var(--sub);padding:24px 8px}
.loading{text-align:center;color:var(--sub);padding:20px;font-size:18px}
.favbtn{margin-left:auto;font-size:16px;padding:8px 12px;border-radius:999px;border:1.5px solid #f5c9a6;background:#fff;color:var(--main2);font-weight:700}
.favbtn.on{background:var(--main);color:#fff;border-color:var(--main)}
/* 설정 */
dialog{border:0;border-radius:18px;padding:18px;width:min(92vw,480px);font-size:18px}
dialog::backdrop{background:#0006}
dialog h2{margin:0 0 6px}
dialog label{display:block;margin-top:14px;font-weight:700}
dialog input[type=range]{width:100%}
dialog .v{float:right;color:var(--main);font-weight:800}
dialog .btns{display:flex;gap:8px;margin-top:18px}
dialog .btns button{flex:1;font-size:19px;padding:12px;border-radius:12px;border:0;font-weight:700}
.toast{position:fixed;left:50%;bottom:20px;transform:translateX(-50%);background:#2b2220;color:#fff;padding:12px 18px;border-radius:12px;font-size:17px;z-index:9;max-width:90vw}
</style>
</head>
<body>
<header>
  <a href="index.html" aria-label="단골 수첩으로 돌아가기">← 수첩</a>
  <h1>🛒 장보기</h1>
  <button id="setBtn" type="button" aria-label="고르는 기준 바꾸기">⚙ 기준</button>
</header>
<main>
  <details class="card free" id="free">
    <summary>💡 이 앱이 무료인 이유</summary>
    <p>단골 수첩은 원장님께 돈을 받지 않아요. 장보기에서 <b>「쿠팡에서 보기」 같은 추천 링크</b>로 사시면, 판매처가 저희에게 <b>소개 수수료</b>를 주고 그 돈으로 앱을 운영합니다.</p>
    <p>원장님이 내시는 값은 링크로 사도 똑같아요. 수수료 때문에 순서를 바꾸지 않고, <b>가격·평점·리뷰 수</b>로만 골라 드려요.</p>
  </details>
  <div class="sample" id="sample">지금은 <u>예시 데이터</u>예요 — 실제 상품·가격이 아닙니다</div>

  <section class="card" aria-label="찾기">
    <button class="mic" id="mic" type="button">🎤 말로 찾기</button>
    <div class="listen hide" id="listen" aria-live="polite"></div>
    <div class="guide hide" id="guide"></div>
    <form class="row" id="form" autocomplete="off">
      <input id="q" type="search" inputmode="search" enterkeyhint="search" placeholder="예) 로레알 염색약 6호 10개" aria-label="찾을 물건과 조건">
      <button class="go" type="submit">찾기</button>
    </form>
    <div class="ex" id="ex"></div>
  </section>

  <div class="seg" role="tablist">
    <button type="button" class="on" data-tab="재료" role="tab">✂️ 미용 재료</button>
    <button type="button" data-tab="꾸미기" role="tab">🪴 매장 꾸미기</button>
  </div>
  <div class="grid" id="grid"></div>
  <div id="ideas"></div>

  <section id="results" aria-live="polite"></section>

  <section class="mine" id="mine"></section>
</main>

<dialog id="setDlg">
  <form method="dialog">
    <h2>⚙ 고르는 기준</h2>
    <p class="note" style="margin-top:0">'추천순'일 때 무엇을 더 중요하게 볼지 정해요. 이 휴대폰에만 저장돼요.</p>
    <label>가격(쌀수록) <span class="v" id="vPrice"></span><input type="range" id="wPrice" min="0" max="100" step="5"></label>
    <label>평점 <span class="v" id="vRating"></span><input type="range" id="wRating" min="0" max="100" step="5"></label>
    <label>리뷰 수 <span class="v" id="vReviews"></span><input type="range" id="wReviews" min="0" max="100" step="5"></label>
    <label>리뷰가 이보다 적으면 빼기 <span class="v" id="vMin"></span><input type="range" id="minReviews" min="0" max="300" step="10"></label>
    <div class="btns">
      <button type="button" id="setReset" style="background:var(--soft);color:var(--main2)">처음대로</button>
      <button value="ok" style="background:var(--main);color:#fff">닫기</button>
    </div>
  </form>
</dialog>

<script src="shop/parser.js"></script>
<script src="shop/data.js"></script>
<script src="shop/rank.js"></script>
<script>window.SHOP_CONFIG = { mode: "mock" /* 쿠팡 키 받은 뒤 "netlify" */, sources: ["coupang"] };</script>
<script src="shop/search.js"></script>
<script src="shop/app.js"></script>
</body>
</html>
